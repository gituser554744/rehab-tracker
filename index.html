<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RehabTrack">
<title>RehabTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0c1018;--surf:#141b27;--surf2:#1c2537;--border:#263042;--accent:#38bdf8;--rest:#f97316;--done:#4ade80;--danger:#f87171;--supp:#a78bfa;--drive:#34a853;--text:#e2e8f0;--muted:#7a8ba3;--r:14px;--rs:8px;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.view{display:none;padding:16px 16px 28px;}
.view.active{display:block;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
#loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{color:var(--muted);font-size:14px;font-weight:700;}
nav{display:flex;background:var(--surf);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:20px;height:20px;stroke-width:2;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:24px;font-weight:900;letter-spacing:-.5px;}
.btn{border:none;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-done{background:var(--done);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-danger{background:var(--danger);color:#0c1018;padding:8px 14px;font-size:13px;}
.btn-ghost{background:var(--surf2);color:var(--text);padding:8px 14px;font-size:13px;border:1px solid var(--border);}
.btn-drive{background:var(--drive);color:#fff;padding:10px 16px;font-size:13px;width:100%;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-big{width:100%;padding:16px;font-size:17px;border-radius:var(--r);letter-spacing:.3px;}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
.tag-reps{background:#1e3a5f;color:var(--accent);}
.tag-time{background:#3b1f0a;color:var(--rest);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:48px;margin-bottom:12px;}
.empty h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text);}
.empty p{font-size:14px;line-height:1.5;}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.ex-card-info{flex:1;min-width:0;}
.ex-card-name{font-size:16px;font-weight:800;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
.ex-actions{display:flex;flex-direction:column;gap:4px;}
.icon-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:var(--surf2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:16px;height:16px;stroke-width:2.5;}
.order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.ord-btn{width:28px;height:22px;border:none;background:var(--surf2);color:var(--muted);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-back.open{opacity:1;pointer-events:all;}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));width:100%;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.modal-back.open .modal{transform:translateY(0);}
.modal-title{font-size:20px;font-weight:900;margin-bottom:20px;}
.form-g{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-btn{padding:12px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;}
.type-btn.sel-reps{border-color:var(--accent);color:var(--accent);background:#1e3a5f44;}
.type-btn.sel-time{border-color:var(--rest);color:var(--rest);background:#3b1f0a44;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal-actions .btn{flex:1;padding:14px;font-size:15px;border-radius:var(--r);}
.wi-header{text-align:center;margin-bottom:24px;}
.wi-header h2{font-size:24px;font-weight:900;margin-bottom:6px;}
.wi-header p{color:var(--muted);font-size:14px;}
.preview-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.preview-num{width:26px;height:26px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
.preview-name{flex:1;font-size:14px;font-weight:700;}
.preview-detail{font-size:13px;color:var(--muted);}
.wa-prog{background:var(--surf);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin:-16px -16px 20px;}
.wa-prog-txt{font-size:12px;font-weight:800;color:var(--muted);}
.wa-bar{height:4px;background:var(--border);border-radius:2px;flex:1;margin:0 12px;overflow:hidden;}
.wa-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}
.wa-elapsed{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);}
.ex-big-name{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:4px;}
.ex-big-sub{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:24px;}
.timer-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;}
.ring-container{position:relative;width:200px;height:200px;}
.ring-svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-prog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .4s;}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-digits{font-family:'Orbitron',monospace;font-size:46px;font-weight:700;line-height:1;transition:color .4s;}
.ring-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-top:8px;}
.set-of{font-size:13px;font-weight:700;color:var(--muted);margin-top:10px;}
.reps-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;gap:16px;}
.set-circles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.set-circ{width:58px;height:58px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);color:var(--muted);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Orbitron',monospace;}
.set-circ.active{border-color:var(--accent);color:var(--accent);}
.set-circ.done{background:var(--done);border-color:var(--done);color:#0c1018;}
.reps-hint{font-size:13px;color:var(--muted);font-weight:700;}
.stopwatch{font-family:'Orbitron',monospace;font-size:28px;font-weight:700;color:var(--surf2);}
.stopwatch.ticking{color:var(--muted);}
.notes-wrap{margin-bottom:20px;}
.notes-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.notes-ta{width:100%;padding:12px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;resize:none;outline:none;height:80px;user-select:text;-webkit-user-select:text;}
.notes-ta:focus{border-color:var(--accent);}
.wa-actions{display:flex;gap:10px;margin-top:4px;}
.wa-actions .btn{flex:1;padding:15px;font-size:15px;border-radius:var(--r);}
.wd-wrap{text-align:center;padding:40px 0 24px;}
.wd-icon{font-size:64px;margin-bottom:16px;}
.wd-title{font-size:28px;font-weight:900;margin-bottom:6px;}
.wd-sub{color:var(--muted);font-size:15px;margin-bottom:28px;}
.wd-stats{background:var(--surf);border-radius:var(--r);padding:20px;margin-bottom:20px;text-align:left;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
.stat-row:last-child{border-bottom:none;}
.stat-lbl{color:var(--muted);font-weight:700;}
.stat-val{font-weight:900;}
/* BACKUP PANEL */
.backup-panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;}
.drive-section{background:var(--surf2);border-radius:var(--rs);padding:14px;margin-bottom:12px;border:1px solid var(--border);}
.drive-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.drive-title{font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px;}
.drive-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s;}
.drive-dot.synced{background:var(--drive);}
.drive-dot.syncing{background:var(--accent);animation:pulse .8s infinite;}
.drive-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.drive-status-text{font-size:11px;color:var(--muted);margin-bottom:10px;}
.drive-actions{display:flex;gap:8px;}
.drive-actions .btn{flex:1;font-size:12px;padding:9px 8px;}
.backup-divider{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:center;margin:10px 0;}
.local-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.local-btns .btn{font-size:12px;padding:10px 8px;text-align:center;}
.backup-pdf-btn{width:100%;padding:12px;font-size:13px;border-radius:var(--rs);margin-bottom:8px;}
.backup-note{font-size:11px;color:var(--muted);line-height:1.5;text-align:center;}
/* HISTORY */
.sess-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.sess-head{padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.sess-date{font-size:15px;font-weight:900;}
.sess-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
.sess-chev{color:var(--muted);transition:transform .2s;flex-shrink:0;}
.sess-card.open .sess-chev{transform:rotate(180deg);}
.sess-body{display:none;padding:0 14px 14px;}
.sess-card.open .sess-body{display:block;}
.sess-ex{padding:10px 0;border-top:1px solid var(--border);}
.sess-ex-name{font-size:14px;font-weight:800;margin-bottom:3px;}
.sess-ex-meta{font-size:13px;color:var(--muted);margin-bottom:3px;}
.sess-ex-notes{font-size:13px;font-style:italic;color:var(--muted);}
.sess-del{background:none;border:none;color:var(--danger);font-size:12px;font-weight:800;cursor:pointer;padding:6px 0;font-family:'Nunito',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
/* SUPPLEMENTS */
.supp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.supp-card-info{flex:1;min-width:0;}
.supp-card-name{font-size:16px;font-weight:800;margin-bottom:3px;}
.supp-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
.supp-card-notes{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;}
.supp-actions{display:flex;flex-direction:column;gap:4px;}
.supp-chk{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;}
.supp-chk.checked{background:var(--supp);border-color:var(--supp);}
.supp-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
/* CONFIRM + TOAST */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.confirm-box{background:var(--surf);border-radius:var(--r);padding:24px;width:100%;max-width:340px;}
.confirm-box h3{font-size:18px;font-weight:900;margin-bottom:8px;}
.confirm-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns .btn{flex:1;padding:13px;font-size:14px;border-radius:var(--rs);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:var(--accent);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
textarea,input{-webkit-user-select:text;user-select:text;}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>Loading your data&hellip;</p></div>
<div id="main" style="display:none">
  <div class="view active" id="view-exercises">
    <div class="page-header"><span class="page-title">Exercises</span><button class="btn btn-primary" onclick="openModal()">+ Add</button></div>
    <div id="ex-list"></div>
  </div>
  <div class="view" id="view-workout"><div id="workout-root"></div></div>
  <div class="view" id="view-supplements">
    <div class="page-header"><span class="page-title">Supplements</span><button class="btn btn-primary" onclick="openSuppModal()" style="background:var(--supp)">+ Add</button></div>
    <div id="supp-content"></div>
  </div>
  <div class="view" id="view-history">
    <div class="page-header"><span class="page-title">History</span></div>
    <div class="backup-panel">
      <!-- GOOGLE DRIVE SECTION -->
      <div class="drive-section" id="drive-section">
        <div class="drive-header">
          <span class="drive-title"><div class="drive-dot" id="drive-dot"></div>Google Drive Sync</span>
          <span id="drive-user-label" style="font-size:11px;color:var(--muted);"></span>
        </div>
        <div class="drive-status-text" id="drive-status-text">Not connected</div>
        <div class="drive-actions" id="drive-actions">
          <button class="btn btn-drive" id="drive-connect-btn" onclick="connectDrive()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            Connect Google Drive
          </button>
        </div>
      </div>
      <div class="backup-divider">&#8212; local backup &amp; export &#8212;</div>
      <button class="btn btn-ghost backup-pdf-btn" onclick="exportPDF()">&#128196; Export PDF &mdash; for healthcare providers</button>
      <div class="local-btns">
        <button class="btn btn-ghost" onclick="exportJSON()">&#128228; Share Backup</button>
        <label class="btn btn-ghost" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px">
          &#128229; Import
          <input type="file" accept=".json" onchange="handleImport(event)" style="display:none">
        </label>
      </div>
      <div class="backup-note">Share Backup opens Android share sheet &rarr; pick Google Drive, Gmail, or any app</div>
    </div>
    <div id="hist-list"></div>
  </div>
</div>
<nav>
  <button class="nav-btn active" id="nav-exercises" onclick="goTo('exercises')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Exercises
  </button>
  <button class="nav-btn" id="nav-workout" onclick="goTo('workout')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>Workout
  </button>
  <button class="nav-btn" id="nav-supplements" onclick="goTo('supplements')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/><rect x="3" y="10" width="18" height="12" rx="2"/></svg>Supps
  </button>
  <button class="nav-btn" id="nav-history" onclick="goTo('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3M3.05 11a9 9 0 1 0 .5-4"/><path d="M3 3v4h4"/></svg>History
  </button>
</nav>
<!-- EXERCISE MODAL -->
<div class="modal-back" id="ex-modal" onclick="handleBackdrop(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-ttl">Add Exercise</div>
    <input type="hidden" id="edit-id">
    <div class="form-g"><label class="form-label">Exercise Name</label><input class="form-input" id="f-name" placeholder="e.g. Clamshells" maxlength="60" autocomplete="off"></div>
    <div class="form-g"><label class="form-label">Type</label><div class="type-toggle"><button class="type-btn sel-reps" id="t-reps" onclick="setType('reps')">&#128170; Reps-Based</button><button class="type-btn" id="t-time" onclick="setType('time')">&#9201; Time-Based</button></div></div>
    <div class="form-g"><label class="form-label">Sets</label><input class="form-input" id="f-sets" type="number" min="1" max="20" placeholder="3"></div>
    <div id="reps-f"><div class="form-g"><label class="form-label">Reps per Set</label><input class="form-input" id="f-reps" type="number" min="1" max="200" placeholder="10"></div></div>
    <div id="time-f" style="display:none"><div class="form-row"><div class="form-g"><label class="form-label">Work (seconds)</label><input class="form-input" id="f-work" type="number" min="1" max="600" placeholder="20"></div><div class="form-g"><label class="form-label">Rest (seconds)</label><input class="form-input" id="f-rest" type="number" min="0" max="600" placeholder="10"></div></div></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExercise()">Save</button></div>
  </div>
</div>
<!-- SUPPLEMENT MODAL -->
<div class="modal-back" id="supp-modal" onclick="handleSuppBackdrop(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="supp-modal-ttl">Add Supplement</div>
    <input type="hidden" id="supp-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="sf-name" placeholder="e.g. Vitamin D3" maxlength="60" autocomplete="off"></div>
    <div class="form-row">
      <div class="form-g"><label class="form-label">Dose</label><input class="form-input" id="sf-dose" placeholder="e.g. 2000 IU" maxlength="30"></div>
      <div class="form-g"><label class="form-label">Frequency</label><input class="form-input" id="sf-freq" placeholder="e.g. Daily" maxlength="30"></div>
    </div>
    <div class="form-g"><label class="form-label">Timing (optional)</label><input class="form-input" id="sf-timing" placeholder="e.g. With breakfast" maxlength="60"></div>
    <div class="form-g"><label class="form-label">Notes (optional)</label><input class="form-input" id="sf-notes" placeholder="e.g. Take with fat for absorption" maxlength="120"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeSuppModal()">Cancel</button><button class="btn btn-primary" onclick="saveSupp()" style="background:var(--supp)">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// PASTE YOUR GOOGLE CLIENT ID HERE (replace the placeholder)
// ============================================================
var GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID_HERE';
// ============================================================

// ============================================================
// INDEXEDDB
// ============================================================
var db = new Dexie('RehabTrackDB');
db.version(1).stores({ kv: 'key' });
var exercises = [], sessions = [], supplements = [], suppLogs = [];

function tryLS(k) { try { return JSON.parse(localStorage.getItem(k)||'null'); } catch(e) { return null; } }

async function loadAll() {
  var recs = await db.kv.bulkGet(['exercises','sessions','supplements','suppLogs','driveFileId']);
  if (recs[0]) {
    exercises   = recs[0].value || [];
    sessions    = recs[1] ? recs[1].value : [];
    supplements = recs[2] ? recs[2].value : [];
    suppLogs    = recs[3] ? recs[3].value : [];
    driveFileId = recs[4] ? recs[4].value : null;
  } else {
    var lsEx = tryLS('rt_ex');
    exercises   = lsEx || [];
    sessions    = tryLS('rt_sess')  || [];
    supplements = tryLS('rt_supps') || [];
    suppLogs    = tryLS('rt_slogs') || [];
    if (lsEx && lsEx.length) {
      await persistAll();
      ['rt_ex','rt_sess','rt_supps','rt_slogs'].forEach(function(k){ localStorage.removeItem(k); });
    }
  }
}

async function persistAll() {
  var items = [
    { key: 'exercises',   value: exercises   },
    { key: 'sessions',    value: sessions    },
    { key: 'supplements', value: supplements },
    { key: 'suppLogs',    value: suppLogs    }
  ];
  if (driveFileId) items.push({ key: 'driveFileId', value: driveFileId });
  await db.kv.bulkPut(items);
}

function persist() {
  persistAll().then(function() { scheduleDriveSync(); }).catch(function(e){ console.warn('persist err', e); });
}

// ============================================================
// UTILS
// ============================================================
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fmt(s) { s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function toast(msg) { var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); },2800); }

// ============================================================
// NAVIGATION
// ============================================================
var VIEW = 'exercises';
function goTo(v) {
  document.querySelectorAll('.view').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(e){ e.classList.remove('active'); });
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  VIEW = v;
  if (v==='exercises')   renderEx();
  if (v==='workout')     renderWorkout();
  if (v==='supplements') renderSupps();
  if (v==='history')     renderHist();
}

// ============================================================
// GOOGLE DRIVE SYNC
// ============================================================
var driveToken = null;
var driveFileId = null;
var driveTokenClient = null;
var driveConnected = false;
var syncTimer = null;
var DRIVE_FILE_NAME = 'rehabtrack-sync.json';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

function driveConfigured() {
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('YOUR_') === -1;
}

function initDriveAuth() {
  if (!driveConfigured()) {
    setDriveStatus('setup', 'Add your Client ID to enable Drive sync');
    return;
  }
  if (!window.google || !window.google.accounts) {
    setTimeout(initDriveAuth, 500);
    return;
  }
  driveTokenClient = window.google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: function(resp) {
      if (resp.error) {
        console.warn('Drive auth error', resp);
        setDriveStatus('error', 'Sign-in failed. Tap to retry.');
        return;
      }
      driveToken = resp.access_token;
      driveConnected = true;
      localStorage.setItem('rt_drive_was_connected', '1');
      setDriveStatus('syncing', 'Syncing now...');
      doSync();
    }
  });
  // If previously connected, try a silent token refresh
  if (localStorage.getItem('rt_drive_was_connected')) {
    setDriveStatus('syncing', 'Reconnecting...');
    driveTokenClient.requestAccessToken({ prompt: '' });
  } else {
    setDriveStatus('disconnected', 'Not connected');
  }
}

function connectDrive() {
  if (!driveConfigured()) {
    alert('Please add your Google Client ID to the HTML file first.');
    return;
  }
  driveTokenClient.requestAccessToken({ prompt: 'consent' });
}

function disconnectDrive() {
  driveToken = null;
  driveConnected = false;
  localStorage.removeItem('rt_drive_was_connected');
  setDriveStatus('disconnected', 'Disconnected');
}

function scheduleDriveSync() {
  if (!driveConnected || !driveToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 3000);
}

async function doSync() {
  if (!driveConnected || !driveToken) return;
  setDriveStatus('syncing', 'Syncing...');
  try {
    var payload = JSON.stringify({ version: 2, synced: new Date().toISOString(), exercises: exercises, sessions: sessions, supplements: supplements, suppLogs: suppLogs });
    // Find existing file if we don't have the ID
    if (!driveFileId) {
      var r = await fetch("https://www.googleapis.com/drive/v3/files?q=name%3D%27" + encodeURIComponent(DRIVE_FILE_NAME) + "%27%20and%20trashed%3Dfalse&spaces=drive&fields=files(id)", {
        headers: { 'Authorization': 'Bearer ' + driveToken }
      });
      if (!r.ok) throw { status: r.status };
      var d = await r.json();
      if (d.files && d.files.length) driveFileId = d.files[0].id;
    }
    if (driveFileId) {
      // Update
      var up = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + driveFileId + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + driveToken, 'Content-Type': 'application/json' },
        body: payload
      });
      if (!up.ok) throw { status: up.status };
    } else {
      // Create
      var form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' })], { type: 'application/json' }));
      form.append('file', new Blob([payload], { type: 'application/json' }));
      var cr = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + driveToken },
        body: form
      });
      if (!cr.ok) throw { status: cr.status };
      var created = await cr.json();
      driveFileId = created.id;
      await db.kv.put({ key: 'driveFileId', value: driveFileId });
    }
    var t = new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    setDriveStatus('synced', 'Synced at ' + t);
  } catch(e) {
    console.warn('Drive sync failed', e);
    if (e && e.status === 401) {
      driveToken = null;
      setDriveStatus('disconnected', 'Session expired &mdash; tap Reconnect');
    } else {
      setDriveStatus('error', 'Sync failed &mdash; will retry');
      syncTimer = setTimeout(doSync, 30000);
    }
  }
}

function setDriveStatus(state, msg) {
  var dot  = document.getElementById('drive-dot');
  var txt  = document.getElementById('drive-status-text');
  var acts = document.getElementById('drive-actions');
  var lbl  = document.getElementById('drive-user-label');
  if (!dot) return;
  dot.className = 'drive-dot' + (state==='synced'?' synced':state==='syncing'?' syncing':state==='error'?' error':'');
  txt.innerHTML = msg;
  if (state === 'disconnected' || state === 'setup') {
    acts.innerHTML = '<button class="btn btn-drive" onclick="connectDrive()" style="font-size:12px;padding:9px 12px"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Connect Google Drive</button>';
    lbl.textContent = '';
  } else if (state === 'synced' || state === 'syncing' || state === 'error') {
    acts.innerHTML = '<button class="btn btn-ghost" onclick="doSync()" style="flex:1;font-size:12px;padding:9px">Sync Now</button><button class="btn btn-ghost" onclick="disconnectDrive()" style="font-size:12px;padding:9px;color:var(--danger)">Disconnect</button>';
  }
}

// ============================================================
// EXERCISES
// ============================================================
function renderEx() {
  var el = document.getElementById('ex-list');
  if (!exercises.length) { el.innerHTML='<div class="empty"><div class="ei">&#127947;</div><h3>No exercises yet</h3><p>Tap <strong>+ Add</strong> to build your rehab routine.</p></div>'; return; }
  el.innerHTML = exercises.map(function(ex,i) {
    return '<div class="ex-card"><div class="order-btns"><button class="ord-btn" onclick="moveEx(''+ex.id+'',-1)" '+(i===0?'style="opacity:.25;pointer-events:none"':'')+'>&#9650;</button><button class="ord-btn" onclick="moveEx(''+ex.id+'',1)" '+(i===exercises.length-1?'style="opacity:.25;pointer-events:none"':'')+'>&#9660;</button></div><div class="ex-card-info"><div class="ex-card-name">'+ex.name+'</div><div class="ex-card-meta"><span class="tag '+(ex.type==='reps'?'tag-reps':'tag-time')+'">'+ex.type+'</span> '+(ex.type==='reps'?ex.sets+' sets x '+ex.reps+' reps':ex.sets+' sets &bull; '+ex.work+'s on / '+ex.rest+'s off')+'</div></div><div class="ex-actions"><button class="icon-btn" onclick="openModal(''+ex.id+'')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="icon-btn" style="color:var(--danger)" onclick="delEx(''+ex.id+'')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></div></div>';
  }).join('');
}
function moveEx(id,dir) { var i=exercises.findIndex(function(e){return e.id===id;}),j=i+dir; if(j<0||j>=exercises.length)return; var t=exercises[i];exercises[i]=exercises[j];exercises[j]=t; persist();renderEx(); }
function delEx(id) { var ex=exercises.find(function(e){return e.id===id;}); confirm2('Delete "'+ex.name+'"?','Removed from list. History unaffected.',function(){ exercises=exercises.filter(function(e){return e.id!==id;}); persist();renderEx(); }); }

var selType='reps';
function openModal(id) {
  document.getElementById('modal-ttl').textContent=id?'Edit Exercise':'Add Exercise';
  document.getElementById('edit-id').value=id||'';
  if(id){var ex=exercises.find(function(e){return e.id===id;});document.getElementById('f-name').value=ex.name;document.getElementById('f-sets').value=ex.sets;setType(ex.type);if(ex.type==='reps')document.getElementById('f-reps').value=ex.reps;else{document.getElementById('f-work').value=ex.work;document.getElementById('f-rest').value=ex.rest;}}
  else{['f-name','f-sets','f-reps','f-work','f-rest'].forEach(function(i){document.getElementById(i).value='';});setType('reps');}
  document.getElementById('ex-modal').classList.add('open');
  setTimeout(function(){document.getElementById('f-name').focus();},350);
}
function closeModal(){document.getElementById('ex-modal').classList.remove('open');}
function handleBackdrop(e){if(e.target.id==='ex-modal')closeModal();}
function setType(t){selType=t;document.getElementById('t-reps').className='type-btn'+(t==='reps'?' sel-reps':'');document.getElementById('t-time').className='type-btn'+(t==='time'?' sel-time':'');document.getElementById('reps-f').style.display=t==='reps'?'':'none';document.getElementById('time-f').style.display=t==='time'?'':'none';}
function saveExercise(){var name=document.getElementById('f-name').value.trim(),sets=parseInt(document.getElementById('f-sets').value)||0;if(!name){alert('Please enter a name.');return;}if(sets<1){alert('Sets must be at least 1.');return;}var extra={};if(selType==='reps'){var reps=parseInt(document.getElementById('f-reps').value)||0;if(reps<1){alert('Reps must be at least 1.');return;}extra={reps:reps};}else{var work=parseInt(document.getElementById('f-work').value)||0,rest=parseInt(document.getElementById('f-rest').value)||0;if(work<1){alert('Work must be at least 1s.');return;}extra={work:work,rest:rest};}var id=document.getElementById('edit-id').value;if(id){var idx=exercises.findIndex(function(e){return e.id===id;});exercises[idx]=Object.assign({},exercises[idx],{name:name,sets:sets,type:selType},extra);}else{exercises.push(Object.assign({id:uid(),name:name,sets:sets,type:selType},extra));}persist();closeModal();if(VIEW==='exercises')renderEx();}

// ============================================================
// SUPPLEMENTS
// ============================================================
function getTodayLog(){var t=todayStr(),log=suppLogs.find(function(l){return l.date===t;});if(!log){log={date:t,taken:[]};suppLogs.unshift(log);}return log;}
function renderSupps(){var el=document.getElementById('supp-content');if(!supplements.length){el.innerHTML='<div class="empty"><div class="ei">&#128138;</div><h3>No supplements yet</h3><p>Tap <strong>+ Add</strong> to track your supplementation.</p></div>';return;}var log=getTodayLog(),today=new Date().toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric'});el.innerHTML='<div class="supp-section-title">Today &mdash; '+today+'</div>'+supplements.map(function(s){var checked=log.taken.indexOf(s.id)>-1;return '<div class="supp-card"><div class="supp-chk '+(checked?'checked':'')+'" onclick="toggleSupp(''+s.id+'')">'+(checked?'&#10003;':'&#9675;')+'</div><div class="supp-card-info"><div class="supp-card-name">'+s.name+'</div><div class="supp-card-meta">'+(s.dose||'')+(s.freq?' &middot; '+s.freq:'')+(s.timing?' &middot; '+s.timing:'')+'</div>'+(s.notes?'<div class="supp-card-notes">'+s.notes+'</div>':'')+'</div><div class="supp-actions"><button class="icon-btn" onclick="openSuppModal(''+s.id+'')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="icon-btn" style="color:var(--danger)" onclick="delSupp(''+s.id+'')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></div></div>';}).join('')+'<div style="text-align:center;margin-top:20px;font-size:13px;color:var(--muted);">'+log.taken.length+' of '+supplements.length+' taken today</div>';}
function toggleSupp(id){var log=getTodayLog(),idx=log.taken.indexOf(id);if(idx>-1)log.taken.splice(idx,1);else log.taken.push(id);persist();renderSupps();}
function delSupp(id){var s=supplements.find(function(x){return x.id===id;});confirm2('Delete "'+s.name+'"?','Removed from supplement list.',function(){supplements=supplements.filter(function(x){return x.id!==id;});persist();renderSupps();});}
function openSuppModal(id){document.getElementById('supp-modal-ttl').textContent=id?'Edit Supplement':'Add Supplement';document.getElementById('supp-edit-id').value=id||'';if(id){var s=supplements.find(function(x){return x.id===id;});document.getElementById('sf-name').value=s.name;document.getElementById('sf-dose').value=s.dose||'';document.getElementById('sf-freq').value=s.freq||'';document.getElementById('sf-timing').value=s.timing||'';document.getElementById('sf-notes').value=s.notes||'';}else{['sf-name','sf-dose','sf-freq','sf-timing','sf-notes'].forEach(function(i){document.getElementById(i).value='';});}document.getElementById('supp-modal').classList.add('open');setTimeout(function(){document.getElementById('sf-name').focus();},350);}
function closeSuppModal(){document.getElementById('supp-modal').classList.remove('open');}
function handleSuppBackdrop(e){if(e.target.id==='supp-modal')closeSuppModal();}
function saveSupp(){var name=document.getElementById('sf-name').value.trim();if(!name){alert('Please enter a supplement name.');return;}var s={name:name,dose:document.getElementById('sf-dose').value.trim(),freq:document.getElementById('sf-freq').value.trim(),timing:document.getElementById('sf-timing').value.trim(),notes:document.getElementById('sf-notes').value.trim()};var id=document.getElementById('supp-edit-id').value;if(id){var idx=supplements.findIndex(function(x){return x.id===id;});supplements[idx]=Object.assign({},supplements[idx],s);}else{supplements.push(Object.assign({id:uid()},s));}persist();closeSuppModal();if(VIEW==='supplements')renderSupps();}

// ============================================================
// WORKOUT ENGINE
// ============================================================
var WS=null,gTimer=null,xTimer=null;
function renderWorkout(){var el=document.getElementById('workout-root');if(!WS)renderIdle(el);else if(WS.done)renderDone(el);else renderActive(el);}
function renderIdle(el){if(!exercises.length){el.innerHTML='<div class="empty"><div class="ei">&#128170;</div><h3>No exercises yet</h3><p>Go to Exercises and add your routine first.</p></div>';return;}var rows=exercises.map(function(ex,i){return '<div class="preview-item"><div class="preview-num">'+(i+1)+'</div><div class="preview-name">'+ex.name+'</div><div class="preview-detail">'+(ex.type==='reps'?ex.sets+'x'+ex.reps:ex.sets+'x'+ex.work+'s')+'</div></div>';}).join('');el.innerHTML='<div class="wi-header"><h2>Ready to Work?</h2><p>'+exercises.length+' exercise'+(exercises.length>1?'s':'')+' in today's routine</p></div><div style="margin-bottom:24px">'+rows+'</div><button class="btn btn-primary btn-big" onclick="startWorkout()">&#9654; &nbsp;Start Workout</button>';}
function startWorkout(){clearIntervals();WS={exs:JSON.parse(JSON.stringify(exercises)),idx:0,start:Date.now(),elapsed:0,results:exercises.map(function(ex){return{id:ex.id,name:ex.name,sets:0,time:0,notes:''};;}),phase:'ready',curSet:1,timeLeft:0,phaseStart:null,exStart:Date.now(),done:false};gTimer=setInterval(function(){WS.elapsed=Math.floor((Date.now()-WS.start)/1000);var d=document.getElementById('wa-elapsed');if(d)d.textContent=fmt(WS.elapsed);},1000);renderActive(document.getElementById('workout-root'));}
function renderActive(el){var ex=WS.exs[WS.idx],res=WS.results[WS.idx],pct=(WS.idx/WS.exs.length)*100,body='';if(ex.type==='time'){var C=2*Math.PI*88,col=WS.phase==='rest'?'var(--rest)':WS.phase==='complete'?'var(--done)':WS.phase==='ready'?'var(--muted)':'var(--accent)',total=WS.phase==='rest'?ex.rest:ex.work,frac=(WS.phase==='ready'||WS.phase==='complete')?1:WS.timeLeft/total,off=C*(1-Math.max(0,frac)),lbl=WS.phase==='ready'?'READY':WS.phase==='work'?'WORK':WS.phase==='rest'?'REST':'DONE',dig=(WS.phase==='ready'||WS.phase==='complete')?'&mdash;':fmt(WS.timeLeft);body='<div class="timer-wrap"><div class="ring-container"><svg class="ring-svg" width="200" height="200" viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle class="ring-prog" id="rp" cx="100" cy="100" r="88" stroke="'+col+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg><div class="ring-inner"><div class="ring-digits" id="rd" style="color:'+col+'">'+dig+'</div><div class="ring-label" id="rl">'+lbl+'</div></div></div><div class="set-of" id="setof">Set '+WS.curSet+' of '+ex.sets+'</div></div>';}else{var circles=Array.from({length:ex.sets},function(_,i){var d=i<res.sets,a=i===res.sets;return '<div class="set-circ'+(d?' done':a?' active':'')+'" onclick="tapSet('+i+')">'+(d?'&#10003;':i+1)+'</div>';}).join('');body='<div class="reps-wrap"><div class="set-circles" id="circ">'+circles+'</div><div class="reps-hint">'+ex.reps+' reps per set &bull; tap each when done</div><div class="stopwatch" id="sw">00:00</div></div>';}var isLast=WS.idx>=WS.exs.length-1,isTimeBusy=ex.type==='time'&&(WS.phase==='work'||WS.phase==='rest'),primaryLabel=ex.type==='time'?(WS.phase==='ready'||WS.phase==='complete'?'&#9654; Start Set '+WS.curSet:(WS.phase==='work'?'&#9889; Working&#8230;':'&#128558; Resting&#8230;')):(isLast?'&#10003; Finish Workout':'Next Exercise &#8594;');el.innerHTML='<div class="wa-prog"><span class="wa-prog-txt">'+(WS.idx+1)+' / '+WS.exs.length+'</span><div class="wa-bar"><div class="wa-fill" style="width:'+pct+'%"></div></div><span class="wa-elapsed" id="wa-elapsed">'+fmt(WS.elapsed)+'</span></div><div class="ex-big-name">'+ex.name+'</div><div class="ex-big-sub">'+(ex.type==='reps'?ex.sets+' sets &middot; '+ex.reps+' reps':ex.sets+' sets &middot; '+ex.work+'s on / '+ex.rest+'s off')+'</div>'+body+'<div class="notes-wrap"><div class="notes-lbl">Notes for this exercise</div><textarea class="notes-ta" id="ex-notes" placeholder="Pain level, form issues, how it felt&#8230;">'+(res.notes||'')+'</textarea></div><div class="wa-actions"><button class="btn btn-ghost" onclick="skipEx()">Skip</button><button class="btn '+(isLast&&ex.type==='reps'?'btn-done':'btn-primary')+'" id="act-btn" style="'+(isTimeBusy?'opacity:.6;pointer-events:none':'')+'" onclick="actionBtn()">'+primaryLabel+'</button></div>';if(ex.type==='reps')startSW();}
function startSW(){clearInterval(xTimer);WS.exStart=WS.exStart||Date.now();xTimer=setInterval(function(){var d=document.getElementById('sw');if(d){d.textContent=fmt(Math.floor((Date.now()-WS.exStart)/1000));d.className='stopwatch ticking';}},500);}
function actionBtn(){var ex=WS.exs[WS.idx];if(ex.type==='time'){if(WS.phase==='ready'||WS.phase==='complete')startWork();}else{advance();}}
function startWork(){var ex=WS.exs[WS.idx];WS.phase='work';WS.timeLeft=ex.work;WS.phaseStart=Date.now();if(!WS.exStart)WS.exStart=Date.now();clearInterval(xTimer);xTimer=setInterval(function(){WS.timeLeft=ex.work-Math.floor((Date.now()-WS.phaseStart)/1000);if(WS.timeLeft<=0){WS.timeLeft=0;clearInterval(xTimer);updateRing();ex.rest>0?startRest():afterSet();}else updateRing();},200);updateRing();}
function startRest(){var ex=WS.exs[WS.idx];WS.phase='rest';WS.timeLeft=ex.rest;WS.phaseStart=Date.now();clearInterval(xTimer);xTimer=setInterval(function(){WS.timeLeft=ex.rest-Math.floor((Date.now()-WS.phaseStart)/1000);if(WS.timeLeft<=0){WS.timeLeft=0;clearInterval(xTimer);updateRing();afterSet();}else updateRing();},200);updateRing();}
function afterSet(){WS.results[WS.idx].sets++;var ex=WS.exs[WS.idx];if(WS.curSet>=ex.sets){WS.phase='complete';recordTime();updateRing();setTimeout(function(){advance();},1200);}else{WS.curSet++;WS.phase='ready';updateRing();}}
function updateRing(){var ex=WS.exs[WS.idx],C=2*Math.PI*88,col=WS.phase==='rest'?'var(--rest)':WS.phase==='complete'?'var(--done)':WS.phase==='ready'?'var(--muted)':'var(--accent)',total=WS.phase==='rest'?ex.rest:ex.work,frac=(WS.phase==='ready'||WS.phase==='complete')?1:WS.timeLeft/total,off=C*(1-Math.max(0,frac));var rp=document.getElementById('rp'),rd=document.getElementById('rd'),rl=document.getElementById('rl'),sf=document.getElementById('setof'),ab=document.getElementById('act-btn');if(rp){rp.style.stroke=col;rp.style.strokeDashoffset=off;}if(rd){rd.style.color=col;rd.textContent=WS.phase==='ready'||WS.phase==='complete'?'—':fmt(WS.timeLeft);}if(rl){var m={ready:'READY',work:'WORK',rest:'REST',complete:'DONE'};rl.textContent=m[WS.phase];}if(sf)sf.textContent='Set '+WS.curSet+' of '+ex.sets;if(ab){var busy=WS.phase==='work'||WS.phase==='rest';ab.style.opacity=busy?'.6':'1';ab.style.pointerEvents=busy?'none':'';ab.textContent=WS.phase==='ready'||WS.phase==='complete'?'&#9654; Start Set '+WS.curSet:WS.phase==='work'?'&#9889; Working&#8230;':'&#128558; Resting&#8230;';}}
function tapSet(i){var res=WS.results[WS.idx];if(i!==res.sets)return;res.sets++;var ex=WS.exs[WS.idx],circ=document.getElementById('circ');if(circ)circ.innerHTML=Array.from({length:ex.sets},function(_,j){var d=j<res.sets,a=j===res.sets;return '<div class="set-circ'+(d?' done':a?' active':'')+'" onclick="tapSet('+j+')">'+(d?'&#10003;':j+1)+'</div>';}).join('');}
function saveNotesNow(){var ta=document.getElementById('ex-notes');if(ta)WS.results[WS.idx].notes=ta.value;}
function recordTime(){if(WS.exStart)WS.results[WS.idx].time=Math.floor((Date.now()-WS.exStart)/1000);}
function skipEx(){saveNotesNow();recordTime();clearInterval(xTimer);advance(true);}
function advance(s){saveNotesNow();recordTime();clearInterval(xTimer);var next=WS.idx+1;if(next>=WS.exs.length){finishWorkout();return;}WS.idx=next;WS.curSet=1;WS.phase='ready';WS.timeLeft=0;WS.exStart=Date.now();renderActive(document.getElementById('workout-root'));}
function finishWorkout(){clearIntervals();WS.done=true;WS.totalTime=Math.floor((Date.now()-WS.start)/1000);var sess={id:uid(),date:new Date().toISOString(),duration:WS.totalTime,exercises:WS.results.filter(function(r){return r.sets>0;})};sessions.unshift(sess);persist();renderDone(document.getElementById('workout-root'));}
function renderDone(el){var done=WS.results.filter(function(r){return r.sets>0;});el.innerHTML='<div class="wd-wrap"><div class="wd-icon">&#127881;</div><div class="wd-title">Workout Complete!</div><div class="wd-sub">'+done.length+' exercise'+(done.length!==1?'s':'')+' &middot; '+fmt(WS.totalTime)+' total</div><div class="wd-stats">'+done.map(function(r){return '<div class="stat-row"><span class="stat-lbl">'+r.name+'</span><span class="stat-val">'+r.sets+' sets &middot; '+fmt(r.time)+'</span></div>';}).join('')+'</div><button class="btn btn-primary btn-big" onclick="newWorkout()">Start New Workout</button><div style="height:10px"></div><button class="btn btn-ghost btn-big" onclick="goTo('history')">View History</button></div>';}
function newWorkout(){WS=null;clearIntervals();renderWorkout();}
function clearIntervals(){clearInterval(gTimer);clearInterval(xTimer);gTimer=null;xTimer=null;}

// ============================================================
// HISTORY

function renderHist(){var el=document.getElementById('hist-list');if(!sessions.length){el.innerHTML='<div class="empty"><div class="ei">&#128202;</div><h3>No sessions yet</h3><p>Complete a workout and your data will appear here.</p></div>';return;}el.innerHTML=sessions.map(function(s){var d=new Date(s.date),ds=d.toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric'}),ts=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}),exRows=s.exercises.map(function(ex){return '<div class="sess-ex"><div class="sess-ex-name">'+ex.name+'</div><div class="sess-ex-meta">'+ex.sets+' set'+(ex.sets!==1?'s':'')+' &middot; '+fmt(ex.time)+'</div>'+(ex.notes?'<div class="sess-ex-notes">&#128221; '+ex.notes+'</div>':'')+'</div>';}).join('');return '<div class="sess-card" id="sc-'+s.id+'"><div class="sess-head" onclick="toggleSess(''+s.id+'')"><div><div class="sess-date">'+ds+'</div><div class="sess-meta">'+ts+' &bull; '+s.exercises.length+' exercise'+(s.exercises.length!==1?'s':'')+' &bull; '+fmt(s.duration)+'</div></div><svg class="sess-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div><div class="sess-body">'+exRows+'<div style="margin-top:14px"><button class="sess-del" onclick="delSess(''+s.id+'')">&#128465; Delete session</button></div></div></div>';}).join('');}
function toggleSess(id){document.getElementById('sc-'+id).classList.toggle('open');}
function delSess(id){confirm2('Delete session?','This workout record will be permanently removed.',function(){sessions=sessions.filter(function(s){return s.id!==id;});persist();renderHist();});}

// ============================================================
function exportPDF(){
  if(!window.jspdf){alert('PDF library still loading, please wait a moment.');return;}

  doc.setFillColor(12,16,24);doc.rect(0,0,W,H,'F');
  doc.setFillColor(26,37,55);doc.rect(0,108,W,78,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(36);doc.setTextColor(56,189,248);
  doc.text('RehabTrack',W/2,92,{align:'center'});
  doc.setFontSize(13);doc.setTextColor(226,232,240);
  doc.text('Personal Rehabilitation Report',W/2,106,{align:'center'});
  doc.setFontSize(10);doc.setTextColor(122,139,163);
  doc.text(dateStr,W/2,128,{align:'center'});
  doc.setTextColor(56,189,248);doc.text('For healthcare provider review  |  Confidential',W/2,142,{align:'center'});
  var AC=[56,189,248],DARK=[12,16,24],GREY=[243,244,246],MUT=[107,114,128];
  function sec(title,sub){doc.addPage();doc.setFillColor(249,250,251);doc.rect(0,0,W,22,'F');doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(DARK[0],DARK[1],DARK[2]);doc.text(title,14,14);if(sub){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text(sub,W-14,14,{align:'right'});}return 28;}
  var y=sec('Supplement Protocol',supplements.length+' supplement'+(supplements.length!==1?'s':'')+' recorded');
  if(supplements.length){doc.autoTable({startY:y,head:[['Supplement','Dose','Frequency','Timing','Notes']],body:supplements.map(function(s){return[s.name,s.dose||'—',s.freq||'—',s.timing||'—',s.notes||'—'];}),headStyles:{fillColor:AC,textColor:DARK,fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:GREY},styles:{fontSize:9,cellPadding:3},columnStyles:{4:{cellWidth:50,fontSize:8}},margin:{left:14,right:14}});}else{doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text('No supplements recorded.',14,y);}
  var logRows=suppLogs.slice(0,30).map(function(log){var d=new Date(log.date+'T00:00:00'),ds=d.toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'}),names=log.taken.map(function(id){var s=supplements.find(function(x){return x.id===id;});return s?s.name:null;}).filter(Boolean);return names.length?[ds,names.join(', '),names.length+' / '+supplements.length]:null;}).filter(Boolean);
  y=sec('Supplement Adherence Log','Last 30 days');
  if(logRows.length){doc.autoTable({startY:y,head:[['Date','Supplements Taken','Count']],body:logRows,headStyles:{fillColor:[167,139,250],textColor:DARK,fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:GREY},styles:{fontSize:9,cellPadding:3},columnStyles:{0:{cellWidth:30},2:{cellWidth:20,halign:'center'}},margin:{left:14,right:14}});}else{doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text('No supplement logs yet.',14,y);}
  y=sec('Workout History',sessions.length+' session'+(sessions.length!==1?'s':'')+' recorded');
  if(sessions.length){var wRows=sessions.slice(0,60).map(function(s){var d=new Date(s.date),ds=d.toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}),detail=s.exercises.map(function(ex){return ex.name+' ('+ex.sets+' sets, '+fmt(ex.time)+')'+(ex.notes?': '+ex.notes:'');}).join('\n');return[ds,fmt(s.duration),detail];});doc.autoTable({startY:y,head:[['Date & Time','Duration','Exercises']],body:wRows,headStyles:{fillColor:[74,222,128],textColor:DARK,fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:GREY},styles:{fontSize:8,cellPadding:3,overflow:'linebreak'},columnStyles:{0:{cellWidth:38},1:{cellWidth:20,halign:'center'}},margin:{left:14,right:14}});}else{doc.setFont('helvetica','italic');doc.setFontSize(10);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text('No workout sessions recorded.',14,y);}

async function exportJSON(){var data={version:2,exported:new Date().toISOString(),exercises:exercises,sessions:sessions,supplements:supplements,suppLogs:suppLogs},json=JSON.stringify(data,null,2),fname='RehabTrack-Backup-'+new Date().toISOString().slice(0,10)+'.json',file=new File([new Blob([json],{type:'application/json'})],fname,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'RehabTrack Backup'});toast('Backup shared!');return;}catch(e){if(e.name==='AbortError')return;}}var url=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('Backup downloaded!');}
async function handleImport(ev){var file=ev.target.files[0];if(!file)return;try{var text=await file.text(),data=JSON.parse(text);if(!data.exercises&&!data.sessions){alert('This doesn\'t look like a RehabTrack backup.');return;}confirm2('Import Backup?','This replaces ALL current data. This cannot be undone.',async function(){exercises=data.exercises||[];sessions=data.sessions||[];supplements=data.supplements||[];suppLogs=data.suppLogs||[];await persistAll();goTo(VIEW);toast('Backup restored!');});}catch(e){alert('Could not read file. Make sure it\'s a valid RehabTrack .json backup.');}ev.target.value='';}
