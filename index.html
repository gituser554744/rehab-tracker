<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RehabTrack">
<title>RehabTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0c1018;--surf:#141b27;--surf2:#1c2537;--border:#263042;--accent:#38bdf8;--work:#22c55e;--stop:#ef4444;--rest:#f97316;--done:#4ade80;--danger:#f87171;--supp:#a78bfa;--text:#e2e8f0;--muted:#7a8ba3;--r:14px;--rs:8px;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.view{display:none;padding:16px 16px 80px;}
.view.active{display:block;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
#loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{color:var(--muted);font-size:14px;font-weight:700;}
nav{display:flex;background:var(--surf);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:20px;height:20px;stroke-width:2;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:24px;font-weight:900;letter-spacing:-.5px;}
.btn{border:none;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-work{background:var(--work);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-danger{background:var(--danger);color:#0c1018;padding:8px 14px;font-size:13px;}
.btn-ghost{background:var(--surf2);color:var(--text);padding:8px 14px;font-size:13px;border:1px solid var(--border);}
.btn-big{width:100%;padding:16px;font-size:17px;border-radius:var(--r);}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
.tag-reps{background:#1e3a5f;color:var(--accent);}
.tag-time{background:#3b1f0a;color:var(--rest);}
.tag-area{background:#2d1f5e;color:var(--supp);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:48px;margin-bottom:12px;}
.empty h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text);}
.empty p{font-size:14px;line-height:1.5;}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-back.open{opacity:1;pointer-events:all;}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));width:100%;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.modal-back.open .modal{transform:translateY(0);}
.modal-title{font-size:20px;font-weight:900;margin-bottom:20px;}
.form-g{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-btn{padding:12px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;}
.type-btn.sel-reps{border-color:var(--accent);color:var(--accent);background:#1e3a5f44;}
.type-btn.sel-time{border-color:var(--rest);color:var(--rest);background:#3b1f0a44;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal-actions .btn{flex:1;padding:14px;font-size:15px;border-radius:var(--r);}
.idle-header{text-align:center;padding:20px 0 16px;}
.idle-greeting{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.idle-prog{font-size:22px;font-weight:900;margin-bottom:4px;}
.idle-prog-sub{font-size:13px;color:var(--muted);}
.idle-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.idle-stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:12px 8px;text-align:center;}
.idle-stat-val{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--accent);line-height:1;}
.idle-stat-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
.idle-ex-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.idle-ex-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.idle-ex-item:last-child{border-bottom:none;}
.idle-ex-item.ss-member{border-left:3px solid var(--accent);}
.idle-ex-num{width:24px;height:24px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
.idle-ex-name{flex:1;font-size:14px;font-weight:700;}
.idle-ex-detail{font-size:12px;color:var(--muted);}
.idle-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.repeat-btn{background:var(--surf2);border:1px solid var(--border);color:var(--text);padding:13px;font-size:14px;width:100%;border-radius:var(--r);}
.sound-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;font-size:13px;color:var(--muted);}
.sound-toggle-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);padding:6px 14px;font-size:18px;cursor:pointer;}
.mood-wrap{padding:20px 0 28px;text-align:center;}
.mood-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.mood-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.mood-row{display:flex;justify-content:center;gap:10px;}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:var(--r);border:2px solid var(--border);background:var(--surf2);cursor:pointer;transition:all .2s;min-width:54px;}
.mood-em{font-size:26px;line-height:1;}
.mood-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.mood-btn.sel{border-color:var(--accent);background:rgba(56,189,248,.1);}
.ex-select-header{font-size:20px;font-weight:900;margin-bottom:6px;}
.ex-select-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.ex-select-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;transition:opacity .2s;}
.ex-select-item.excluded{opacity:.35;}
.ex-select-toggle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;transition:all .2s;color:var(--muted);}
.ex-select-toggle.on{background:var(--work);border-color:var(--work);color:#0c1018;}
.ex-select-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.ex-select-detail{font-size:12px;color:var(--muted);}
.wa-prog{background:var(--surf);padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin:-16px -16px 0;}
.wa-prog-txt{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;}
.wa-bar{height:4px;background:var(--border);border-radius:2px;flex:1;overflow:hidden;}
.wa-fill{height:100%;border-radius:2px;background:var(--work);transition:width .4s;}
.wa-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.session-elapsed{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);}
.sound-sm{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;line-height:1;}
.ex-content{padding:20px 0 0;}
.ss-indicator{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);border-radius:var(--rs);padding:9px 14px;margin-bottom:14px;font-size:12px;font-weight:800;color:var(--accent);}
.ex-big-name{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:6px;}
.ex-big-sub{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ready-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:28px;text-align:center;margin-bottom:20px;}
.ready-set{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.ready-detail{font-size:26px;font-weight:900;color:var(--work);}
.ready-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.timer-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
.ring-container{position:relative;width:200px;height:200px;}
.ring-svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-prog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .35s linear,stroke .35s;}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-digits{font-family:'Orbitron',monospace;font-size:46px;font-weight:700;line-height:1;transition:color .35s;}
.ring-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px;text-align:center;}
.rest-sw-wrap{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:var(--r);padding:24px 20px;text-align:center;margin-bottom:20px;}
.rest-sw-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--rest);margin-bottom:6px;}
.rest-sw-display{font-family:'Orbitron',monospace;font-size:54px;font-weight:700;color:var(--rest);line-height:1;margin-bottom:6px;}
.rest-sw-set{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:16px;}
.btn-rest-done{width:100%;padding:14px;font-size:15px;border-radius:var(--r);background:var(--rest);color:#fff;border:none;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;}
.reps-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;gap:14px;}
.set-circles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.set-circ{width:58px;height:58px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);color:var(--muted);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Orbitron',monospace;}
.set-circ.active{border-color:var(--work);color:var(--work);box-shadow:0 0 0 3px rgba(34,197,94,.2);}
.set-circ.done{background:var(--work);border-color:var(--work);color:#0c1018;}
.reps-hint{font-size:13px;color:var(--muted);font-weight:700;}
.ex-elapsed{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:var(--muted);}
.pain-wrap{margin-bottom:16px;}
.pain-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.pain-row{display:flex;gap:5px;}
.pain-btn{flex:1;padding:10px 2px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;text-align:center;transition:all .2s;}
.pain-btn.p0{border-color:var(--done);background:rgba(74,222,128,.15);color:var(--done);}
.pain-btn.p1{border-color:#86efac;background:rgba(134,239,172,.1);color:#86efac;}
.pain-btn.p2{border-color:#fde047;background:rgba(253,224,71,.1);color:#ca8a04;}
.pain-btn.p3{border-color:#fb923c;background:rgba(251,146,60,.1);color:#fb923c;}
.pain-btn.p4{border-color:#f87171;background:rgba(248,113,113,.1);color:var(--danger);}
.pain-btn.p5{border-color:#ef4444;background:rgba(239,68,68,.15);color:#ef4444;}
.notes-wrap{margin-bottom:20px;}
.notes-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.notes-ta{width:100%;padding:12px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;resize:none;outline:none;height:76px;user-select:text;-webkit-user-select:text;}
.notes-ta:focus{border-color:var(--accent);}
.wa-actions{display:flex;gap:10px;margin-top:8px;padding-bottom:16px;}
.wa-actions .btn{flex:1;padding:15px;font-size:15px;border-radius:var(--r);}
.post-wrap{padding:20px 0;}
.post-title{font-size:24px;font-weight:900;margin-bottom:4px;}
.post-sub{font-size:14px;color:var(--muted);margin-bottom:24px;}
.post-stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;}
.post-stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;}
.post-stat-row:last-child{border-bottom:none;}
.post-stat-lbl{color:var(--muted);font-weight:700;flex:1;}
.post-stat-val{font-weight:900;text-align:right;}
.rating-wrap{margin-bottom:20px;}
.rating-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
.star-row{display:flex;gap:8px;justify-content:center;}
.star-btn{font-size:32px;background:none;border:none;cursor:pointer;opacity:.25;transition:opacity .2s,transform .1s;padding:4px;}
.star-btn.on{opacity:1;}
.star-btn:active{transform:scale(.9);}
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.prog-tab{flex-shrink:0;padding:8px 14px;border-radius:99px;border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .2s;}
.prog-tab.viewing{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1);}
.prog-tab.is-active::after{content:" \2605";}
.prog-manage-btn{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:13px;display:flex;align-items:center;gap:10px;}
.ex-card.ss-member{border-left:3px solid var(--accent);}
.ex-card.ss-top{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;}
.ex-card.ss-mid{border-radius:0;border-top:none;border-bottom:none;}
.ex-card.ss-bot{border-top-left-radius:0;border-top-right-radius:0;border-top:none;margin-bottom:0;}
.ex-card.standalone{margin-bottom:10px;}
.chain-row{display:flex;align-items:center;justify-content:center;padding:3px 0;}
.chain-row.is-linked{padding:0;}
.chain-active{display:flex;align-items:center;gap:6px;width:100%;padding:4px 0;}
.chain-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.chain-lbl{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;}
.chain-break-btn{background:none;border:1px solid rgba(248,113,113,.4);border-radius:4px;color:var(--danger);font-size:11px;font-weight:800;padding:2px 8px;cursor:pointer;white-space:nowrap;}
.chain-link-btn{background:var(--surf2);border:1px dashed var(--border);border-radius:99px;color:var(--muted);font-size:11px;font-weight:800;padding:5px 14px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.chain-link-btn:active{border-color:var(--accent);color:var(--accent);}
.ex-card-info{flex:1;min-width:0;}
.ex-card-name{font-size:16px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-card-meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ex-card-actions{display:flex;flex-direction:column;gap:4px;}
.icon-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:var(--surf2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:16px;height:16px;stroke-width:2.5;}
.order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.ord-btn{width:28px;height:22px;border:none;background:var(--surf2);color:var(--muted);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
.supp-top-row{display:flex;gap:8px;margin-bottom:16px;}
.supp-top-row .btn{flex:1;padding:11px;font-size:12px;}
.supp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.supp-card-info{flex:1;min-width:0;}
.supp-card-name{font-size:16px;font-weight:800;margin-bottom:3px;}
.supp-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
.supp-card-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;}
.supp-actions{display:flex;flex-direction:column;gap:4px;}
.supp-chk{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;}
.supp-chk.checked{background:var(--supp);border-color:var(--supp);}
.supp-day-header{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.export-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.export-bar .btn{padding:10px 6px;font-size:11px;text-align:center;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.dash-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:14px 10px;text-align:center;}
.dash-val{font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:3px;}
.dash-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.week-grid{display:flex;gap:4px;margin-bottom:20px;}
.week-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.week-day-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;}
.week-dot{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;}
.week-dot.done{background:var(--work);border-color:var(--work);}
.week-dot.today{border-color:var(--accent);}
.supp-bar{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.supp-bar-lbl{font-size:12px;font-weight:800;color:var(--muted);}
.supp-bar-val{font-size:13px;font-weight:900;color:var(--supp);}
.sess-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.sess-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.sess-date{font-size:15px;font-weight:900;}
.sess-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
.sess-mood-stars{font-size:11px;color:var(--muted);margin-top:3px;}
.sess-chev{color:var(--muted);transition:transform .2s;flex-shrink:0;}
.sess-card.open .sess-chev{transform:rotate(180deg);}
.sess-body{display:none;padding:0 14px 14px;}
.sess-card.open .sess-body{display:block;}
.sess-ex{padding:9px 0;border-top:1px solid var(--border);}
.sess-ex-name{font-size:14px;font-weight:800;margin-bottom:2px;}
.sess-ex-meta{font-size:12px;color:var(--muted);margin-bottom:2px;}
.sess-ex-pain{font-size:12px;margin-bottom:2px;}
.sess-ex-notes{font-size:12px;font-style:italic;color:var(--muted);}
.sess-actions{display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border);}
.sess-actions .btn{flex:1;padding:10px;font-size:12px;}
.prog-item{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.prog-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.prog-item-name{font-size:15px;font-weight:900;}
.prog-item-active{font-size:10px;font-weight:800;color:var(--work);text-transform:uppercase;letter-spacing:.6px;}
.prog-item-btns{display:flex;gap:6px;flex-wrap:wrap;}
.prog-item-btns .btn{font-size:11px;padding:7px 10px;}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.confirm-box{background:var(--surf);border-radius:var(--r);padding:24px;width:100%;max-width:340px;}
.confirm-box h3{font-size:18px;font-weight:900;margin-bottom:8px;}
.confirm-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns .btn{flex:1;padding:13px;font-size:14px;border-radius:var(--rs);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:var(--accent);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
textarea,input,select{-webkit-user-select:text;user-select:text;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Loading RehabTrack&hellip;</p></div>
<div id="main" style="display:none">
  <div class="view active" id="view-practice"><div id="practice-root"></div></div>
  <div class="view" id="view-exercises">
    <div class="page-header"><span class="page-title">Exercises</span><button class="prog-manage-btn" onclick="openProgModal()" title="Manage Programs">&#9881;</button></div>
    <div class="prog-row" id="prog-tabs"></div>
    <div id="ex-list"></div>
    <button class="btn btn-primary btn-big" onclick="openExModal()" style="margin-top:12px">+ Add Exercise</button>
  </div>
  <div class="view" id="view-supps">
    <div class="page-header"><span class="page-title">Supplements</span><button class="btn btn-primary" onclick="openSuppModal()" style="background:var(--supp);font-size:13px">+ Add</button></div>
    <div id="supp-content"></div>
  </div>
  <div class="view" id="view-history">
    <div class="page-header"><span class="page-title">History</span></div>
    <div class="export-bar">
      <button class="btn btn-ghost" onclick="exportPDF()">&#128196; PDF</button>
      <button class="btn btn-ghost" onclick="exportCSV()">&#128202; CSV</button>
      <label class="btn btn-ghost" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800">&#128229; Import<input type="file" accept=".json" onchange="handleImport(event)" style="display:none"></label>
    </div>
    <button class="btn btn-ghost" onclick="exportJSON()" style="width:100%;padding:11px;font-size:13px;margin-bottom:16px">&#128228; Share / Save JSON Backup</button>
    <div id="dashboard"></div><div id="hist-list"></div>
  </div>
</div>
<nav>
  <button class="nav-btn active" id="nav-practice" onclick="goTo('practice')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>Practice
  </button>
  <button class="nav-btn" id="nav-exercises" onclick="goTo('exercises')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Exercises
  </button>
  <button class="nav-btn" id="nav-supps" onclick="goTo('supps')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>Supps
  </button>
  <button class="nav-btn" id="nav-history" onclick="goTo('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3M3.05 11a9 9 0 1 0 .5-4"/><path d="M3 3v4h4"/></svg>History
  </button>
</nav>
<div class="modal-back" id="ex-modal" onclick="if(event.target.id==='ex-modal')closeExModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="ex-modal-ttl">Add Exercise</div>
    <input type="hidden" id="ex-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="f-name" placeholder="e.g. Bicep Curls" maxlength="60" autocomplete="off"></div>
    <div class="form-g"><label class="form-label">Type</label><div class="type-toggle"><button class="type-btn sel-reps" id="t-reps" onclick="setExType('reps')">&#128170; Reps-Based</button><button class="type-btn" id="t-time" onclick="setExType('time')">&#9201; Time-Based</button></div></div>
    <div class="form-g"><label class="form-label">Body Area</label>
      <select class="form-input" id="f-area">
        <option value="Hip">Hip</option><option value="Back">Back</option><option value="Biceps">Biceps</option>
        <option value="Triceps">Triceps</option><option value="Shoulders">Shoulders</option><option value="Chest">Chest</option>
        <option value="Core">Core</option><option value="Legs">Legs</option><option value="Knees">Knees</option><option value="Feet">Feet</option>
      </select>
    </div>
    <div class="form-g"><label class="form-label">Sets</label><input class="form-input" id="f-sets" type="number" min="1" max="20" placeholder="3"></div>
    <div id="reps-f"><div class="form-g"><label class="form-label">Reps per Set</label><input class="form-input" id="f-reps" type="number" min="1" max="200" placeholder="10"></div></div>
    <div id="time-f" style="display:none"><div class="form-row"><div class="form-g"><label class="form-label">Work (sec)</label><input class="form-input" id="f-work" type="number" min="1" max="3600" placeholder="30"></div><div class="form-g"><label class="form-label">Rest (sec)</label><input class="form-input" id="f-rest" type="number" min="0" max="600" placeholder="0"></div></div></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeExModal()">Cancel</button><button class="btn btn-primary" onclick="saveExercise()">Save</button></div>
  </div>
</div>
<div class="modal-back" id="supp-modal" onclick="if(event.target.id==='supp-modal')closeSuppModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="supp-modal-ttl">Add Supplement</div>
    <input type="hidden" id="supp-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="sf-name" placeholder="e.g. Vitamin D3" maxlength="60" autocomplete="off"></div>
    <div class="form-row"><div class="form-g"><label class="form-label">Dose</label><input class="form-input" id="sf-dose" placeholder="2000 IU" maxlength="30"></div><div class="form-g"><label class="form-label">Frequency</label><input class="form-input" id="sf-freq" placeholder="Daily" maxlength="30"></div></div>
    <div class="form-g"><label class="form-label">Timing (optional)</label><input class="form-input" id="sf-timing" placeholder="With breakfast" maxlength="60"></div>
    <div class="form-g"><label class="form-label">Notes (optional)</label><input class="form-input" id="sf-notes" placeholder="Take with fat" maxlength="120"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeSuppModal()">Cancel</button><button class="btn btn-primary" onclick="saveSupp()" style="background:var(--supp)">Save</button></div>
  </div>
</div>
<div class="modal-back" id="prog-modal" onclick="if(event.target.id==='prog-modal')closeProgModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Programs</div>
    <div id="prog-list"></div>
    <button class="btn btn-primary btn-big" onclick="addProgram()" style="margin-top:8px">+ New Program</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost btn-big" onclick="closeProgModal()">Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>

// === DB ===
var db=new Dexie('RehabTrackDB');
db.version(2).stores({kv:'key'});
var programs=[],sessions=[],supplements=[],suppLogs=[],soundEnabled=true;
function tryLS(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}

// === DEFAULT DATA BUILDERS ===
function buildDefaultPractice(){
  return {id:uid(),name:'260611 Practice 1',isActive:false,createdAt:new Date().toISOString(),exercises:[
    {id:uid(),name:'ITB Knuckle Mash',type:'time',sets:1,work:30,rest:0,area:'Knees'},
    {id:uid(),name:'Medial Patellar Glides & Pulses',type:'time',sets:1,work:30,rest:0,area:'Knees'},
    {id:uid(),name:'Leg Extensions (Modified Tracking)',type:'reps',sets:3,reps:12,area:'Knees'},
    {id:uid(),name:'Accelerated Isokinetic Machine (Iso)',type:'reps',sets:4,reps:15,area:'Knees'},
    {id:uid(),name:'Resisted Adduction & Abduction',type:'reps',sets:3,reps:12,area:'Knees'},
    {id:uid(),name:'Light Leg Press (Single Leg)',type:'reps',sets:3,reps:12,area:'Legs'},
    {id:uid(),name:'Touch-and-Go Step Ups & Step Downs',type:'reps',sets:3,reps:12,area:'Knees'},
    {id:uid(),name:'Slide Plate Reverse Lunges',type:'reps',sets:3,reps:12,area:'Legs'},
    {id:uid(),name:'Single-Leg Balance (Right Leg)',type:'time',sets:3,work:30,rest:0,area:'Knees'},
    {id:uid(),name:'Concept 2 Rower',type:'time',sets:1,work:600,rest:0,area:'Legs'},
    {id:uid(),name:'Exercise Bike',type:'time',sets:1,work:600,rest:0,area:'Legs'},
    {id:uid(),name:'Cross Trainer',type:'time',sets:1,work:600,rest:0,area:'Legs'}
  ]};
}

function buildDefaultSupplements(){
  return [
    {id:uid(),name:'Collagen',dose:'15g',freq:'Daily',timing:'',notes:''},
    {id:uid(),name:'Creatine',dose:'5g',freq:'Daily',timing:'',notes:''},
    {id:uid(),name:'Magnesium (Breakfast)',dose:'120mg',freq:'Daily',timing:'With breakfast',notes:''},
    {id:uid(),name:'Magnesium (Dinner)',dose:'240mg',freq:'Daily',timing:'With dinner',notes:''},
    {id:uid(),name:'Fish Oil',dose:'2 capsules',freq:'Daily',timing:'With breakfast',notes:''},
    {id:uid(),name:'Vitamin D3',dose:'2000 IU',freq:'Daily',timing:'With breakfast',notes:''}
  ];
}

function buildFridaySession(prog){
  var results=[];
  (prog.exercises||[]).forEach(function(ex){
    var n=(ex.name||'').toLowerCase();
    var isIso=n.indexOf('iso')>-1;
    var isRower=n.indexOf('rower')>-1;
    var isBike=n.indexOf('bike')>-1;
    var isCross=n.indexOf('cross')>-1;
    if(isIso||isRower||isBike)return;
    var sc=isCross?1:ex.sets;
    var ts=isCross?300:(ex.type==='time'?ex.work*ex.sets:480);
    results.push({exerciseId:ex.id,name:ex.name,area:ex.area||'',type:ex.type,targetSets:ex.sets,targetReps:ex.reps||0,targetWork:ex.work||0,targetRest:ex.rest||0,setsCompleted:sc,timeSpent:ts,restIntervals:[],pain:0,notes:''});
  });
  return {id:uid(),date:'2026-06-12T20:30:00+10:00',endTime:'2026-06-12T21:30:00+10:00',duration:3600,mood:4,rating:4,notes:'First session. 5 min Cross Trainer cool down.',programId:prog.id,programName:prog.name,exercises:results};
}

function buildSundaySession(prog){
  var results=[];
  (prog.exercises||[]).forEach(function(ex){
    var n=(ex.name||'').toLowerCase();
    var isIso=n.indexOf('iso')>-1;
    var isRower=n.indexOf('rower')>-1;
    var isBike=n.indexOf('bike')>-1;
    var isCross=n.indexOf('cross')>-1;
    if(isIso||isRower||isBike)return;
    var sc=isCross?1:ex.sets;
    var ts=isCross?300:(ex.type==='time'?ex.work*ex.sets:420);
    results.push({exerciseId:ex.id,name:ex.name,area:ex.area||'',type:ex.type,targetSets:ex.sets,targetReps:ex.reps||0,targetWork:ex.work||0,targetRest:ex.rest||0,setsCompleted:sc,timeSpent:ts,restIntervals:[],pain:0,notes:''});
  });
  return {id:uid(),date:'2026-06-14T10:50:00+10:00',endTime:'2026-06-14T11:42:00+10:00',duration:3120,mood:4,rating:4,notes:'Second session.',programId:prog.id,programName:prog.name,exercises:results};
}

async function loadAll(){
  var r=await db.kv.bulkGet(['programs','sessions','supplements','suppLogs','soundEnabled']);
  if(r[0]){programs=r[0].value||[];sessions=r[1]?r[1].value:[];supplements=r[2]?r[2].value:[];suppLogs=r[3]?r[3].value:[];soundEnabled=r[4]?r[4].value:true;}
  else{var oldEx=tryLS('rt_ex');sessions=tryLS('rt_sess')||[];supplements=tryLS('rt_supps')||[];suppLogs=tryLS('rt_slogs')||[];programs=[{id:uid(),name:'My Program',exercises:oldEx||[],isActive:true,createdAt:new Date().toISOString()}];if(oldEx&&oldEx.length)await persistAll();['rt_ex','rt_sess','rt_supps','rt_slogs'].forEach(function(k){localStorage.removeItem(k);});}
  if(!programs.length)programs=[{id:uid(),name:'My Program',exercises:[],isActive:true,createdAt:new Date().toISOString()}];
  var changed=false;
  // Inject 260611 Practice 1
  if(!programs.find(function(p){return p.name==='260611 Practice 1';})){programs.push(buildDefaultPractice());changed=true;}
  // Add Iso to existing 260611 if missing
  var p260=programs.find(function(p){return p.name==='260611 Practice 1';});
  if(p260&&!p260.exercises.find(function(e){return (e.name||'').indexOf('Iso')>-1;})){
    var isoEx={id:uid(),name:'Accelerated Isokinetic Machine (Iso)',type:'reps',sets:4,reps:15,area:'Knees'};
    var legIdx=p260.exercises.findIndex(function(e){return (e.name||'').indexOf('Leg Extension')>-1;});
    if(legIdx>-1)p260.exercises.splice(legIdx+1,0,isoEx);else p260.exercises.push(isoEx);
    changed=true;
  }
  // Inject default supplements
  if(!supplements.find(function(s){return (s.name||'').indexOf('Collagen')>-1;})){
    buildDefaultSupplements().forEach(function(s){supplements.push(s);});changed=true;
  }
  // Inject suppLogs June 8-14
  var logDates=['2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-06-12','2026-06-13','2026-06-14','2026-06-15'];
  logDates.forEach(function(date){
    if(!suppLogs.find(function(l){return l.date===date;})){
      suppLogs.push({date:date,taken:supplements.map(function(s){
        var h=(s.timing||'').toLowerCase().indexOf('dinner')>-1?'19':'08';
        return {id:s.id,time:date+'T'+h+':00:00+10:00'};
      })});
      changed=true;
    }
  });
  suppLogs.sort(function(a,b){return b.date.localeCompare(a.date);});
  // Inject Friday session
  var p260f=programs.find(function(p){return p.name==='260611 Practice 1';});
  if(p260f&&!sessions.find(function(s){return s.date.indexOf('2026-06-12')>-1&&s.programName==='260611 Practice 1';})){sessions.unshift(buildFridaySession(p260f));changed=true;}
  var p260sun=programs.find(function(p){return p.name==='260611 Practice 1';});
  if(p260sun&&!sessions.find(function(s){return s.date.indexOf('2026-06-14')>-1&&s.programName==='260611 Practice 1';})){sessions.unshift(buildSundaySession(p260sun));changed=true;}
  sessions.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(changed)await persistAll();
}

async function persistAll(){await db.kv.bulkPut([{key:'programs',value:programs},{key:'sessions',value:sessions},{key:'supplements',value:supplements},{key:'suppLogs',value:suppLogs},{key:'soundEnabled',value:soundEnabled}]);}
function persist(){persistAll().catch(function(e){console.warn(e);});}

// === UTILS ===
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function todayStr(){var d=new Date();var aest=new Date(d.getTime()+10*60*60*1000);return aest.toISOString().slice(0,10);}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric'});}
function stars(n,of){var s='';for(var i=1;i<=of;i++)s+=(i<=n?'\u2605':'\u2606');return s;}
function painLabel(p){return['None','Mild','Moderate','Significant','Severe','Max'][p]||'';}
function painColor(p){return['#4ade80','#86efac','#fde047','#fb923c','#f87171','#ef4444'][p]||'#7a8ba3';}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2800);}
function confirm2(title,msg,cb){var div=document.createElement('div');div.className='confirm-overlay';div.innerHTML='<div class="confirm-box"><h3>'+title+'</h3><p>'+msg+'</p><div class="confirm-btns"><button class="btn btn-ghost" onclick="this.closest(\'.confirm-overlay\').remove()">Cancel</button><button class="btn btn-danger" id="cy">Confirm</button></div></div>';div.querySelector('#cy').onclick=function(){div.remove();cb();};document.body.appendChild(div);}

// === AUDIO ===
var audioCtx=null;
function ensureAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function playTone(freq,dur,vol){if(!soundEnabled||!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||0.4,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+dur);}catch(e){}}
function playWorkEnd(){playTone(880,0.5,0.5);}
function playRestEnd(){playTone(659,0.18,0.4);setTimeout(function(){playTone(880,0.4,0.5);},200);}
function playSetDone(){playTone(523,0.08,0.3);setTimeout(function(){playTone(784,0.18,0.35);},110);}
function toggleSound(){soundEnabled=!soundEnabled;persist();var icon=soundEnabled?'&#128266;':'&#128263;';['sound-btn','idle-sound-btn'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=icon;});}

// === NAV ===
var VIEW='practice',viewedProgId=null;
function goTo(v){document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active');});document.querySelectorAll('.nav-btn').forEach(function(e){e.classList.remove('active');});document.getElementById('view-'+v).classList.add('active');document.getElementById('nav-'+v).classList.add('active');VIEW=v;if(v==='practice')renderPractice();if(v==='exercises')renderExercises();if(v==='supps')renderSupps();if(v==='history')renderHistory();}

// === SUPERSET BLOCKS ===
function buildBlocks(exs){var blocks=[],i=0;while(i<exs.length){var block=[i];while(exs[i]&&exs[i].chainNext&&i+1<exs.length){i++;block.push(i);}blocks.push(block);i++;}return blocks;}

// === PRACTICE ENGINE ===
var PS=null,gTimer=null,cTimer=null,swTimer=null;
function getActiveProg(){return programs.find(function(p){return p.isActive;})||programs[0];}
function getCurBlock(){return PS.blocks[PS.blockIdx];}
function getCurExIdx(){return getCurBlock()[PS.exInBlock];}
function getCurEx(){return PS.exs[getCurExIdx()];}
function getCurRes(){return PS.results[getCurExIdx()];}
function isSS(){return getCurBlock().length>1;}
function isLastInBlock(){return PS.exInBlock>=getCurBlock().length-1;}
function isLastBlock(){return PS.blockIdx>=PS.blocks.length-1;}
function blockSets(){return PS.exs[getCurBlock()[0]].sets;}
function isLastSet(){return PS.curSet>=blockSets();}

function renderPractice(){var el=document.getElementById('practice-root');if(!el)return;if(!PS)renderPracticeIdle(el);else if(PS.status==='mood')renderMoodSelect(el);else if(PS.status==='select')renderExerciseSelect(el);else if(PS.status==='active')renderCurrentEx();else if(PS.status==='rating')renderPostPractice(el);else if(PS.status==='done')renderPracticeDone(el);}

function renderPracticeIdle(el){
  var prog=getActiveProg(),streak=calcStreak(),total=sessions.length,lastSess=sessions[0];
  var blocks=buildBlocks(prog.exercises);
