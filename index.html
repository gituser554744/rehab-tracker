<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c1018">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RehabTrack">
    <title>RehabTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --bg:#0c1018;--surf:#141b27;--surf2:#1c2537;--border:#263042;
            --accent:#38bdf8;--rest:#f97316;--done:#4ade80;--danger:#f87171;
            --supp:#a78bfa;--text:#e2e8f0;--muted:#7a8ba3;--r:14px;--rs:8px;
        }
        html,body{height:100%;overflow:hidden;}
        body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;}
        #main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
        .view{display:none;padding:16px 16px 28px;}
        .view.active{display:block;}
        #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
        #loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        #loading p{color:var(--muted);font-size:14px;font-weight:700;}
        nav{display:flex;background:var(--surf);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .2s;}
        .nav-btn.active{color:var(--accent);}
        .nav-btn svg{width:20px;height:20px;stroke-width:2;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
        .page-title{font-size:24px;font-weight:900;letter-spacing:-.5px;}
        .btn{border:none;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;}
        .btn:active{transform:scale(.96);}
        .btn-primary{background:var(--accent);color:#0c1018;padding:10px 18px;font-size:14px;}
        .btn-done{background:var(--done);color:#0c1018;padding:10px 18px;font-size:14px;}
        .btn-danger{background:var(--danger);color:#0c1018;padding:8px 14px;font-size:13px;}
        .btn-ghost{background:var(--surf2);color:var(--text);padding:8px 14px;font-size:13px;border:1px solid var(--border);}
        .btn-big{width:100%;padding:16px;font-size:17px;border-radius:var(--r);letter-spacing:.3px;}
        .tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
        .tag-reps{background:#1e3a5f;color:var(--accent);}
        .tag-time{background:#3b1f0a;color:var(--rest);}
        .empty{text-align:center;padding:60px 20px;color:var(--muted);}
        .empty .ei{font-size:48px;margin-bottom:12px;}
        .empty h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text);}
        .empty p{font-size:14px;line-height:1.5;}
        .ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .ex-card-info{flex:1;min-width:0;}
        .ex-card-name{font-size:16px;font-weight:800;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .ex-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
        .ex-actions{display:flex;flex-direction:column;gap:4px;}
        .icon-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:var(--surf2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .icon-btn svg{width:16px;height:16px;stroke-width:2.5;}
        .order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
        .ord-btn{width:28px;height:22px;border:none;background:var(--surf2);color:var(--muted);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
        .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
        .modal-back.open{opacity:1;pointer-events:all;}
        .modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));width:100%;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
        .modal-back.open .modal{transform:translateY(0);}
        .modal-title{font-size:20px;font-weight:900;margin-bottom:20px;}
        .form-g{margin-bottom:16px;}
        .form-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;}
        .form-input{width:100%;padding:12px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .2s;}
        .form-input:focus{border-color:var(--accent);}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .type-btn{padding:12px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;}
        .type-btn.sel-reps{border-color:var(--accent);color:var(--accent);background:#1e3a5f44;}
        .type-btn.sel-time{border-color:var(--rest);color:var(--rest);background:#3b1f0a44;}
        .modal-actions{display:flex;gap:10px;margin-top:24px;}
        .modal-actions .btn{flex:1;padding:14px;font-size:15px;border-radius:var(--r);}
        .wi-header{text-align:center;margin-bottom:24px;}
        .wi-header h2{font-size:24px;font-weight:900;margin-bottom:6px;}
        .wi-header p{color:var(--muted);font-size:14px;}
        .preview-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
        .preview-num{width:26px;height:26px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
        .preview-name{flex:1;font-size:14px;font-weight:700;}
        .preview-detail{font-size:13px;color:var(--muted);}
        .wa-prog{background:var(--surf);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin:-16px -16px 20px;}
        .wa-prog-txt{font-size:12px;font-weight:800;color:var(--muted);}
        .wa-bar{height:4px;background:var(--border);border-radius:2px;flex:1;margin:0 12px;overflow:hidden;}
        .wa-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s;}
        .wa-elapsed{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);}
        .ex-big-name{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:4px;}
        .ex-big-sub{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:24px;}
        .timer-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;}
        .ring-container{position:relative;width:200px;height:200px;}
        .ring-svg{transform:rotate(-90deg);}
        .ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
        .ring-prog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .4s;}
        .ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .ring-digits{font-family:'Orbitron',monospace;font-size:46px;font-weight:700;line-height:1;transition:color .4s;}
        .ring-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-top:8px;}
        .set-of{font-size:13px;font-weight:700;color:var(--muted);margin-top:10px;}
        .reps-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;gap:16px;}
        .set-circles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
        .set-circ{width:58px;height:58px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);color:var(--muted);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Orbitron',monospace;}
        .set-circ.active{border-color:var(--accent);color:var(--accent);}
        .set-circ.done{background:var(--done);border-color:var(--done);color:#0c1018;}
        .reps-hint{font-size:13px;color:var(--muted);font-weight:700;}
        .stopwatch{font-family:'Orbitron',monospace;font-size:28px;font-weight:700;color:var(--surf2);}
        .stopwatch.ticking{color:var(--muted);}
        .notes-wrap{margin-bottom:20px;}
        .notes-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
        .notes-ta{width:100%;padding:12px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;resize:none;outline:none;height:80px;user-select:text;-webkit-user-select:text;}
        .notes-ta:focus{border-color:var(--accent);}
        .wa-actions{display:flex;gap:10px;margin-top:4px;}
        .wa-actions .btn{flex:1;padding:15px;font-size:15px;border-radius:var(--r);}
        .wd-wrap{text-align:center;padding:40px 0 24px;}
        .wd-icon{font-size:64px;margin-bottom:16px;}
        .wd-title{font-size:28px;font-weight:900;margin-bottom:6px;}
        .wd-sub{color:var(--muted);font-size:15px;margin-bottom:28px;}
        .wd-stats{background:var(--surf);border-radius:var(--r);padding:20px;margin-bottom:20px;text-align:left;}
        .stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
        .stat-row:last-child{border-bottom:none;}
        .stat-lbl{color:var(--muted);font-weight:700;}
        .stat-val{font-weight:900;}
        .hist-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px;}
        .backup-zone{background:var(--surf);border:1px dashed var(--border);border-radius:var(--r);padding:14px;margin-top:16px;font-size:13px;}
        .backup-title{font-weight:800;font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;letter-spacing:.5px;}
        .backup-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .sess-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
        .sess-head{padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
        .sess-date{font-size:15px;font-weight:900;}
        .sess-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
        .sess-chev{color:var(--muted);transition:transform .2s;flex-shrink:0;}
        .sess-card.open .sess-chev{transform:rotate(180deg);}
        .sess-body{display:none;padding:0 14px 14px;}
        .sess-card.open .sess-body{display:block;}
        .sess-ex{padding:10px 0;border-top:1px solid var(--border);}
        .sess-ex-name{font-size:14px;font-weight:800;margin-bottom:3px;}
        .sess-ex-meta{font-size:13px;color:var(--muted);margin-bottom:3px;}
        .sess-ex-notes{font-size:13px;font-style:italic;color:var(--muted);}
        .sess-del{background:none;border:none;color:var(--danger);font-size:12px;font-weight:800;cursor:pointer;padding:6px 0;font-family:'Nunito',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
        .supp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .supp-card-info{flex:1;min-width:0;}
        .supp-card-name{font-size:16px;font-weight:800;margin-bottom:3px;}
        .supp-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
        .supp-card-notes{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;}
        .supp-actions{display:flex;flex-direction:column;gap:4px;}
        .supp-chk{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;}
        .supp-chk.checked{background:var(--supp);border-color:var(--supp);}
        .supp-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
        .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
        .confirm-box{background:var(--surf);border-radius:var(--r);padding:24px;width:100%;max-width:340px;}
        .confirm-box h3{font-size:18px;font-weight:900;margin-bottom:8px;}
        .confirm-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
        .confirm-btns{display:flex;gap:10px;}
        .confirm-btns .btn{flex:1;padding:13px;font-size:14px;border-radius:var(--rs);}
        textarea,input{-webkit-user-select:text;user-select:text;}
    </style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>Loading secure data logs...</p></div>
<div id="main" style="display:none">
  <div class="view active" id="view-exercises">
    <div class="page-header"><span class="page-title">Exercises</span><button class="btn btn-primary" onclick="openModal()">+ Add</button></div>
    <div id="ex-list"></div>
  </div>
  <div class="view" id="view-practice"><div id="workout-root"></div></div>
  <div class="view" id="view-supplements">
    <div class="page-header"><span class="page-title">Supplements</span><button class="btn btn-primary" onclick="openSuppModal()" style="background:var(--supp)">+ Add</button></div>
    <div id="supp-content"></div>
  </div>
  <div class="view" id="view-history">
    <div class="page-header"><span class="page-title">History</span></div>
    <div class="hist-actions">
      <button class="btn btn-primary" onclick="exportPDF()" style="width:100%;padding:12px;font-size:14px;">📄 Export Report to PDF</button>
    </div>
    <div id="hist-list"></div>
    <div class="backup-zone">
      <div class="backup-title">Local Portability Safety Net</div>
      <div class="backup-btns">
        <button class="btn btn-ghost" onclick="exportDatabaseJSON()" style="padding:10px;font-size:12px;">📥 Save JSON</button>
        <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()" style="padding:10px;font-size:12px;">📤 Load JSON</button>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importDatabaseJSON(this)">
    </div>
  </div>
</div>
<nav>
  <button class="nav-btn active" id="nav-exercises" onclick="goTo('exercises')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Exercises
  </button>
  <button class="nav-btn" id="nav-practice" onclick="goTo('practice')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>Practice
  </button>
  <button class="nav-btn" id="nav-supplements" onclick="goTo('supplements')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a5 5 0 0 1 5 5v3H7V7a5 5 0 0 1 5-5z"/><rect x="3" y="10" width="18" height="12" rx="2"/></svg>Supps
  </button>
  <button class="nav-btn" id="nav-history" onclick="goTo('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3M3.05 11a9 9 0 1 0 .5-4"/><path d="M3 3v4h4"/></svg>History
  </button>
</nav>

<div class="modal-back" id="ex-modal" onclick="handleBackdrop(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-ttl">Add Exercise</div>
    <input type="hidden" id="edit-id">
    <div class="form-g"><label class="form-label">Exercise Name</label><input class="form-input" id="f-name" placeholder="e.g. Clamshells" maxlength="60" autocomplete="off"></div>
    <div class="form-g"><label class="form-label">Type</label><div class="type-toggle"><button class="type-btn sel-reps" id="t-reps" onclick="setType('reps')">💪 Reps-Based</button><button class="type-btn" id="t-time" onclick="setType('time')">⏱ Time-Based</button></div></div>
    <div class="form-g"><label class="form-label">Sets</label><input class="form-input" id="f-sets" type="number" min="1" max="20" placeholder="3"></div>
    <div id="reps-f"><div class="form-g"><label class="form-label">Reps per Set</label><input class="form-input" id="f-reps" type="number" min="1" max="200" placeholder="10"></div></div>
    <div id="time-f" style="display:none"><div class="form-row"><div class="form-g"><label class="form-label">Work (seconds)</label><input class="form-input" id="f-work" type="number" min="1" max="600" placeholder="20"></div><div class="form-g"><label class="form-label">Rest (seconds)</label><input class="form-input" id="f-rest" type="number" min="0" max="600" placeholder="10"></div></div></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveExercise()">Save</button></div>
  </div>
</div>

<div class="modal-back" id="supp-modal" onclick="handleSuppBackdrop(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="supp-modal-ttl">Add Supplement</div>
    <input type="hidden" id="supp-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="sf-name" placeholder="e.g. Vitamin D3" maxlength="60" autocomplete="off"></div>
    <div class="form-row">
      <div class="form-g"><label class="form-label">Dose</label><input class="form-input" id="sf-dose" placeholder="e.g. 2000 IU" maxlength="30"></div>
      <div class="form-g"><label class="form-label">Frequency</label><input class="form-input" id="sf-freq" placeholder="e.g. Daily" maxlength="30"></div>
    </div>
    <div class="form-g"><label class="form-label">Timing (optional)</label><input class="form-input" id="sf-timing" placeholder="e.g. With breakfast" maxlength="60"></div>
    <div class="form-g"><label class="form-label">Notes (optional)</label><input class="form-input" id="sf-notes" placeholder="e.g. Take with fat for absorption" maxlength="120"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeSuppModal()">Cancel</button><button class="btn btn-primary" onclick="saveSupp()" style="background:var(--supp)">Save</button></div>
  </div>
</div>

<script>
// --- INITIALISE PERSISTENT STORAGE LAYER (IndexedDB Engine) ---
const db = new Dexie("RehabTrackDB");
db.version(1).stores({
  exercises: 'id, order',
  sessions: 'id, date',
  supplements: 'id',
  suppLogs: 'date'
});

var exercises=[], sessions=[], supplements=[], suppLogs=[];

// System bootstrap verification loop
async function syncDatabaseMemory() {
  try {
    exercises = await db.exercises.orderBy('order').toArray();
    sessions = await db.sessions.orderBy('date').reverse().toArray();
    supplements = await db.supplements.toArray();
    suppLogs = await db.suppLogs.orderBy('date').reverse().toArray();
    
    // Automatic backward compatibility migration loop for legacy localStorage blocks
    if(exercises.length === 0 && localStorage.getItem('rt_ex')) {
      const oldEx = JSON.parse(localStorage.getItem('rt_ex') || '[]');
      const oldSess = JSON.parse(localStorage.getItem('rt_sess') || '[]');
      const oldSupp = JSON.parse(localStorage.getItem('rt_supps') || '[]');
      const oldLogs = JSON.parse(localStorage.getItem('rt_slogs') || '[]');
      
      for(let [i, x] of oldEx.entries()) { x.order = i; await db.exercises.put(x); }
      for(let x of oldSess) await db.sessions.put(x);
      for(let x of oldSupp) await db.supplements.put(x);
      for(let x of oldLogs) await db.suppLogs.put(x);
      
      localStorage.removeItem('rt_ex');
      return syncDatabaseMemory();
    }
  } catch (err) {
    console.error("Database sync failed:", err);
  }
}

function uid()){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function todayStr(){return new Date().toISOString().slice(0,10);}
var VIEW='exercises';

async function goTo(v){
  await syncDatabaseMemory();
  document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(e){e.classList.remove('active');});
  
  const targetView = document.getElementById('view-'+v);
  const targetNav = document.getElementById('nav-'+v);
  if (targetView) targetView.classList.add('active');
  if (targetNav) targetNav.classList.add('active');
  
  VIEW=v;
  if(v==='exercises') renderEx();
  if(v==='practice') renderWorkout();
  if(v==='supplements') renderSupps();
  if(v==='history') renderHist();
}

function renderEx(){
  var el=document.getElementById('ex-list');
  if(!el) return;
  if(!exercises.length){
    el.innerHTML='<div class="empty"><div class="ei">\u{1F3CB}\uFE0F</div><h3>No exercises yet</h3><p>Tap <strong>+ Add</strong> to build your rehab routine.</p></div>';
    return;
  }
  el.innerHTML=exercises.map(function(ex,i){
    return '<div class="ex-card"><div class="order-btns"><button class="ord-btn" style="height:26px; margin-bottom:2px; '+(i===0?'opacity:.25;pointer-events:none':'')+'" onclick="moveEx(\''+ex.id+'\',-1)">▲</button><button class="ord-btn" style="height:26px; '+(i===exercises.length-1?'opacity:.25;pointer-events:none':'')+'" onclick="moveEx(\''+ex.id+'\',1)">▼</button></div><div class="ex-card-info"><div class="ex-card-name">'+ex.name+'</div><div class="ex-card-meta"><span class="tag '+(ex.type==='reps'?'tag-reps':'tag-time')+'">'+ex.type+'</span> '+(ex.type==='reps'?ex.sets+' sets x '+ex.reps+' reps':ex.sets+' sets &bull; '+ex.work+'s on / '+ex.rest+'s off')+'</div></div><div class="ex-actions"><button class="icon-btn" onclick="openModal(\''+ex.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="icon-btn" style="color:var(--danger)" onclick="delEx(\''+ex.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></div></div>';
  }).join('');
}

async function moveEx(id,dir){
  var i=exercises.findIndex(function(e){return e.id===id;}),j=i+dir;
  if(j<0||j>=exercises.length)return;
  var tmp=exercises[i]; exercises[i]=exercises[j]; exercises[j]=tmp;
  
  for(let index=0; index<exercises.length; index++) {
    await db.exercises.update(exercises[index].id, {order: index});
  }
  await goTo('exercises');
}

function delEx(id){
  var ex=exercises.find(function(e){return e.id===id;});
  confirm2('Delete "'+ex.name+'"?','Removed from list. History unaffected.', async function(){
    await db.exercises.delete(id);
    await goTo('exercises');
  });
}

var selType='reps';
function openModal(id){
  document.getElementById('modal-ttl').textContent=id?'Edit Exercise':'Add Exercise';
  document.getElementById('edit-id').value=id||'';
  if(id){
    var ex=exercises.find(function(e){return e.id===id;});
    document.getElementById('f-name').value=ex.name;
    document.getElementById('f-sets').value=ex.sets;
    setType(ex.type);
    if(ex.type==='reps')document.getElementById('f-reps').value=ex.reps;
    else{document.getElementById('f-work').value=ex.work;document.getElementById('f-rest').value=ex.rest;}
  }else{
    ['f-name','f-sets','f-reps','f-work','f-rest'].forEach(function(i){document.getElementById(i).value='';});
    setType('reps');
  }
  document.getElementById('ex-modal').classList.add('open');
  setTimeout(function(){document.getElementById('f-name').focus();},350);
}
function closeModal(){document.getElementById('ex-modal').classList.remove('open');}
function handleBackdrop(e){if(e.target.id==='ex-modal')closeModal();}
function setType(t){selType=t;document.getElementById('t-reps').className='type-btn'+(t==='reps'?' sel-reps':'');document.getElementById('t-time').className='type-btn'+(t==='time'?' sel-time':'');document.getElementById('reps-f').style.display=t==='reps'?'':'none';document.getElementById('time-f').style.display=t==='time'?'':'none';}

async function saveExercise(){
  var name=document.getElementById('f-name').value.trim(),sets=parseInt(document.getElementById('f-sets').value)||0;
  if(!name){alert('Please enter a name.');return;}
  if(sets<1){alert('Sets must be at least 1.');return;}
  var extra={};
  if(selType==='reps'){
    var reps=parseInt(document.getElementById('f-reps').value)||0;
    if(reps<1){alert('Reps must be at least 1.');return;}
    extra={reps:reps};
  }else{
    var work=parseInt(document.getElementById('f-work').value)||0,rest=parseInt(document.getElementById('f-rest').value)||0;
    if(work<1){alert('Work duration must be at least 1 second.');return;}
    extra={work:work,rest:rest};
  }
  var id=document.getElementById('edit-id').value;
  if(id){
    var exObj=exercises.find(function(e){return e.id===id;});
    await db.exercises.put(Object.assign({},exObj,{name:name,sets:sets,type:selType},extra));
  }else{
    await db.exercises.put(Object.assign({id:uid(),name:name,sets:sets,type:selType,order:exercises.length},extra));
  }
  closeModal();
  await goTo('exercises');
}

function getTodayLog(){
  var t=todayStr(),log=suppLogs.find(function(l){return l.date===t;});
  if(!log){log={date:t,taken:[]};}
  return log;
}

function renderSupps(){
  var el=document.getElementById('supp-content');
  if(!el) return;
  if(!supplements.length){
    el.innerHTML='<div class="empty"><div class="ei">\uD83D\uDC8A</div><h3>No supplements yet</h3><p>Tap <strong>+ Add</strong> to track your supplementation.</p></div>';
    return;
  }
  var log=getTodayLog(),today=new Date().toLocaleDateString('en-GB',{weekday:'long',month:'long',day:'numeric'});
  el.innerHTML='<div class="supp-section-title">Today &mdash; '+today+'</div>'+supplements.map(function(s){
    var checked=log.taken.indexOf(s.id)>-1;
    return '<div class="supp-card"><div class="supp-chk '+(checked?'checked':'')+'" onclick="toggleSupp(\''+s.id+'\')">'+(checked?'&#10003;':'&#9675;')+'</div><div class="supp-card-info"><div class="supp-card-name">'+s.name+'</div><div class="supp-card-meta">'+(s.dose||'')+(s.freq?' &middot; '+s.freq:'')+(s.timing?' &middot; '+s.timing:'')+'</div>'+(s.notes?'<div class="supp-card-notes">'+s.notes+'</div>':'')+'</div><div class="supp-actions"><button class="icon-btn" onclick="openSuppModal(\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="icon-btn" style="color:var(--danger)" onclick="delSupp(\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></div></div>';
  }).join('')+'<div style="text-align:center;margin-top:20px;font-size:13px;color:var(--muted);">' + (log.taken ? log.taken.length : 0) + ' of ' + supplements.length + ' taken today</div>';

async function toggleSupp(id){
  var log=getTodayLog(),idx=log.taken.indexOf(id);
  if(idx>-1) log.taken.splice(idx,1);
  else log.taken.push(id);
  await db.suppLogs.put(log);
  await goTo('supplements');
}

function delSupp(id){
  var s=supplements.find(function(x){return x.id===id;});
  confirm2('Delete "'+s.name+'"?','Removed from your supplement list.', async function(){
    await db.supplements.delete(id);
    for(let log of suppLogs) {
      let tidx = log.taken.indexOf(id);
      if(tidx > -1) { log.taken.splice(tidx, 1); await db.suppLogs.put(log); }
    }
    await goTo('supplements');
  });
}

async function saveSupp(){
  var name=document.getElementById('sf-name').value.trim();
  if(!name){alert('Please enter a supplement name.');return;}
  var s={
    name:name,
    dose:document.getElementById('sf-dose').value.trim(),

var WS=null,gTimer=null,xTimer=null;
function renderWorkout(){var el=document.getElementById('workout-root'); if(!el) return; if(!WS)renderIdle(el); else if(WS.done)renderDone(el); else renderActive(el);}

function renderIdle(el){
  if(!exercises.length){
    el.innerHTML='<div class="empty"><div class="ei">\uD83D\uDCAA</div><h3>No exercises yet</h3><p>Go to Exercises and add your routine first.</p></div>';
    return;
  }
  var rows=exercises.map(function(ex,i){
    return '<div class="preview-item"><div class="preview-num">'+(i+1)+'</div><div class="preview-name">'+ex.name+'</div><div class="preview-detail">'+(ex.type==='reps'?ex.sets+'x'+ex.reps:ex.sets+'x'+ex.work+'s')+'</div></div>';
  }).join('');
  el.innerHTML='<div class="wi-header"><h2>Ready to Practice?</h2><p>'+exercises.length+' exercise'+(exercises.length>1?'s':'')+' in today\'s routine</p></div><div style="margin-bottom:24px">'+rows+'</div><button class="btn btn-primary btn-big" onclick="startWorkout()">\u25B6 &nbsp;Start Practice</button>';
}

function startWorkout(){
  clearIntervals();
  WS={exs:JSON.parse(JSON.stringify(exercises)),idx:0,start:Date.now(),elapsed:0,results:exercises.map(function(ex){return {id:ex.id,name:ex.name,sets:0,time:0,notes:''};}),phase:'ready',curSet:1,timeLeft:0,phaseStart:null,exStart:Date.now(),done:false};
  gTimer=setInterval(function(){
    WS.elapsed=Math.floor((Date.now()-WS.start)/1000);
    var d=document.getElementById('wa-elapsed');
    if(d)d.textContent=fmt(WS.elapsed);
  },1000);
  renderActive(document.getElementById('workout-root'));
}

function renderActive(el){
  var ex=WS.exs[WS.idx],res=WS.results[WS.idx],pct=(WS.idx/WS.exs.length)*100,body='';
  if(ex.type==='time'){
    var C=2*Math.PI*88,col=WS.phase==='rest'?'var(--rest)':WS.phase==='complete'?'var(--done)':WS.phase==='ready'?'var(--muted)':'var(--accent)',total=WS.phase==='rest'?ex.rest:ex.work,frac=WS.phase==='ready'||WS.phase==='complete'?1:WS.timeLeft/total,off=C*(1-Math.max(0,frac)),lbl=WS.phase==='ready'?'READY':WS.phase==='work'?'WORK':WS.phase==='rest'?'REST':'DONE',dig=WS.phase==='ready'||WS.phase==='complete'?'&mdash;':fmt(WS.timeLeft);
    body='<div class="timer-wrap"><div class="ring-container"><svg class="ring-svg" width="200" height="200" viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="88"/><circle class="ring-prog" id="rp" cx="100" cy="100" r="88" stroke="'+col+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg><div class="ring-inner"><div class="ring-digits" id="rd" style="color:'+col+'">'+dig+'</div><div class="ring-label" id="rl">'+lbl+'</div></div></div><div class="set-of" id="setof">Set '+WS.curSet+' of '+ex.sets+'</div></div>';
  }else{
    var circles=Array.from({length:ex.sets},function(_,i){
      var d=i<res.sets,a=i===res.sets;
      return '<div class="set-circ'+(d?' done':a?' active':'')+'" onclick="tapSet('+i+')">'+(d?'&#10003;':i+1)+'</div>';
    }).join('');
    body='<div class="reps-wrap"><div class="set-circles" id="circ">'+circles+'</div><div class="reps-hint">'+ex.reps+' reps per set &bull; tap each when done</div><div class="stopwatch" id="sw">00:00</div></div>';
  }
  var isLast=WS.idx>=WS.exs.length-1,isTimeBusy=ex.type==='time'&&(WS.phase==='work'||WS.phase==='rest'),primaryLabel=ex.type==='time'?(WS.phase==='ready'||WS.phase==='complete'?'\u25B6 Start Set '+WS.curSet:(WS.phase==='work'?'\u26A1 Working\u2026':'\uD83D\uDE2E\u200D\uD83D\uDCA8 Resting\u2026')):(isLast?'\u2713 Finish Practice':'Next Exercise \u2192');
  el.innerHTML='<div class="wa-prog"><span class="wa-prog-txt">'+(WS.idx+1)+' / '+WS.exs.length+'</span><div class="wa-bar"><div class="wa-fill" style="width:'+pct+'%"></div></div><span class="wa-elapsed" id="wa-elapsed">'+fmt(WS.elapsed)+'</span></div><div class="ex-big-name">'+ex.name+'</div><div class="ex-big-sub">'+(ex.type==='reps'?ex.sets+' sets &middot; '+ex.reps+' reps':ex.sets+' sets &bull; '+ex.work+'s on / '+ex.rest+'s off')+'</div>'+body+'<div class="notes-wrap"><div class="notes-lbl">Notes for this exercise</div><textarea class="notes-ta" id="ex-notes" placeholder="Pain level, form issues, how it felt\u2026">'+(res.notes||'')+'</textarea></div><div class="wa-actions"><button class="btn btn-ghost" onclick="skipEx()">Skip</button><button class="btn '+(isLast&&ex.type==='reps'?'btn-done':'btn-primary')+'" id="act-btn" style="'+(isTimeBusy?'opacity:.6;pointer-events:none':'')+'" onclick="actionBtn()">'+primaryLabel+'</button></div>';
  if(ex.type==='reps')startSW();
}

function startSW(){clearInterval(xTimer);WS.exStart=WS.exStart||Date.now();xTimer=setInterval(function(){var d=document.getElementById('sw');if(d){d.textContent=fmt(Math.floor((Date.now()-WS.exStart)/1000));d.className='stopwatch ticking';}},500);}
function actionBtn(){var ex=WS.exs[WS.idx];if(ex.type==='time'){if(WS.phase==='ready'||WS.phase==='complete')startWork();}else{advance();}}

function startWork(){
  var ex=WS.exs[WS.idx];WS.phase='work';WS.timeLeft=ex.work;WS.phaseStart=Date.now();if(!WS.exStart)WS.exStart=Date.now();clearInterval(xTimer);
  xTimer=setInterval(function(){
    WS.timeLeft=ex.work-Math.floor((Date.now()-WS.phaseStart)/1000);
    if(WS.timeLeft<=0){WS.timeLeft=0;clearInterval(xTimer);updateRing();ex.rest>0?startRest():afterSet();}
    else updateRing();
  },200);
  updateRing();
}

function startRest(){
  var ex=WS.exs[WS.idx];WS.phase='rest';WS.timeLeft=ex.rest;WS.phaseStart=Date.now();clearInterval(xTimer);
  xTimer=setInterval(function(){
    WS.timeLeft=ex.rest-Math.floor((Date.now()-WS.phaseStart)/1000);
    if(WS.timeLeft<=0){WS.timeLeft=0;clearInterval(xTimer);updateRing();afterSet();}
    else updateRing();
  },200);
  updateRing();
}

function afterSet(){
  WS.results[WS.idx].sets++;var ex=WS.exs[WS.idx];
  if(WS.curSet>=ex.sets){
    WS.phase='complete';recordTime();updateRing();
    setTimeout(function(){advance();},1200);
  }else{WS.curSet++;WS.phase='ready';updateRing();}
}

function updateRing(){
  var ex=WS.exs[WS.idx],C=2*Math.PI*88,col=WS.phase==='rest'?'var(--rest)':WS.phase==='complete'?'var(--done)':WS.phase==='ready'?'var(--muted)':'var(--accent)',total=WS.phase==='rest'?ex.rest:ex.work,frac=WS.phase==='ready'||WS.phase==='complete'?1:WS.timeLeft/total,off=C*(1-Math.max(0,frac));
  var rp=document.getElementById('rp'),rd=document.getElementById('rd'),rl=document.getElementById('rl'),sf=document.getElementById('setof'),ab=document.getElementById('act-btn');
  if(rp){rp.style.stroke=col;rp.style.strokeDashoffset=off;}
  if(rd){rd.style.color=col;rd.textContent=WS.phase==='ready'||WS.phase==='complete'?'—':fmt(WS.timeLeft);}
  if(rl){var lmap={ready:'READY',work:'WORK',rest:'REST',complete:'DONE'};rl.textContent=lmap[WS.phase];}
  if(sf)sf.textContent='Set '+WS.curSet+' of '+ex.sets;
  if(ab){
    var busy=WS.phase==='work'||WS.phase==='rest';ab.style.opacity=busy?'.6':'1';ab.style.pointerEvents=busy?'none':'';
    ab.textContent=WS.phase==='ready'||WS.phase==='complete'?'\u25B6 Start Set '+WS.curSet:WS.phase==='work'?'\u26A1 Working\u2026':'\uD83D\uDE2E\u200D\uD83D\uDCA8 Resting\u2026';
  }
}

function tapSet(i){
  var res=WS.results[WS.idx];if(i!==res.sets)return;res.sets++;var ex=WS.exs[WS.idx],circ=document.getElementById('circ');
  if(circ)circ.innerHTML=Array.from({length:ex.sets},function(_,j){
    var d=j<res.sets,a=j===res.sets;return '<div class="set-circ'+(d?' done':a?' active':'')+'" onclick="tapSet('+j+')">'+(d?'&#10003;':j+1)+'</div>';
  }).join('');
}
function saveNotesNow(){var ta=document.getElementById('ex-notes');if(ta)WS.results[WS.idx].notes=ta.value;}
function recordTime(){if(WS.exStart)WS.results[WS.idx].time=Math.floor((Date.now()-WS.exStart)/1000);}
function skipEx(){saveNotesNow();recordTime();clearInterval(xTimer);advance(true);}

async function advance(skipped){
  saveNotesNow();recordTime();clearInterval(xTimer);
  var next=WS.idx+1;
  if(next>=WS.exs.length){await finishWorkout();return;}
  WS.idx=next;WS.curSet=1;WS.phase='ready';WS.timeLeft=0;WS.exStart=Date.now();
  renderActive(document.getElementById('workout-root'));
}

async function finishWorkout(){
  clearIntervals();WS.done=true;WS.totalTime=Math.floor((Date.now()-WS.start)/1000);
  var sess={id:uid(),date:new Date().toISOString(),duration:WS.totalTime,exercises:WS.results.filter(function(r){return r.sets>0;})};
  await db.sessions.put(sess);
  renderDone(document.getElementById('workout-root'));
}

function renderDone(el){
  var done=WS.results.filter(function(r){return r.sets>0;});
  el.innerHTML='<div class="wd-wrap"><div class="wd-icon">\uD83C\uDF89</div><div class="wd-title">Practice Complete!</div><div class="wd-sub">'+done.length+' exercise'+(done.length!==1?'s':'')+' &middot; '+fmt(WS.totalTime)+' total</div><div class="wd-stats">'+done.map(function(r){return '<div class="stat-row"><span class="stat-lbl">'+r.name+'</span><span class="stat-val">'+r.sets+' sets &middot; '+fmt(r.time)+'</span></div>';}).join('')+'</div><button class="btn btn-primary btn-big" onclick="newWorkout()">Start New Practice Session</button><div style="height:10px"></div><button class="btn btn-ghost btn-big" onclick="goTo(\'history\')">View History</button></div>';
}
function newWorkout(){WS=null;clearIntervals();renderWorkout();}
function clearIntervals(){clearInterval(gTimer);clearInterval(xTimer);gTimer=null;xTimer=null;}

function renderHist(){
  var el=document.getElementById('hist-list');
  if(!el) return;
  if(!sessions.length){
    el.innerHTML='<div class="empty"><div class="ei">\uD83D\uDCCA</div><h3>No sessions yet</h3><p>Complete a practice session and your data will appear here.</p></div>';
    return;
  }
  el.innerHTML=sessions.map(function(s){

      return '<div class="sess-ex"><div class="sess-ex-name">'+ex.name+'</div><div class="sess-ex-meta">'+ex.sets+' set'+(ex.sets!==1?'s':'')+' completed &middot; '+fmt(ex.time)+'</div>'+(ex.notes?'<div class="sess-ex-notes">\uD83D\uDCDD '+ex.notes+'</div>':'')+'</div>';

  }).join('');

function toggleSess(id){document.getElementById('sc-'+id).classList.toggle('open');}

function delSess(id){
  confirm2('Delete session?','This practice record will be permanently removed.', async function(){
    await db.sessions.delete(id);
    await goTo('history');
  });
}

async function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const rightBorderMargin = doc.internal.pageSize.width - 14;
  const dateStr = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(12, 16, 24);
  doc.text("Clinical Performance & Recovery Report", 14, 20);
  
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(122, 139, 163);
  doc.text("Generated: " + dateStr, 14, 26);
  doc.text("Classification: Healthcare Team Review / Personal Confidential Data", 14, 31);
  
  doc.setDrawColor(38, 48, 66);
  doc.setLineWidth(0.5);
  doc.line(14, 35, rightBorderMargin, 35);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.setTextColor(167, 139, 250);
  doc.text("1. Configured Supplement Stack Matrix", 14, 45);

  const suppTableBody = supplements.map(s => [s.name, s.dose || '—', s.freq || '—', s.timing || '—', s.notes || '—']);
  doc.autoTable({
    startY: 49,
    head: [['Supplement Name', 'Dosage Metric', 'Frequency Strategy', 'Timing Target', 'Clinical Notes']],
    body: suppTableBody.length ? suppTableBody : [['No supplements configured in active profile.', '', '', '', '']],
    theme: 'striped',
    headStyles: { fillColor: [167, 139, 250], fontSize: 9 },
    styles: { fontSize: 8.5, cellPadding: 3 }
  });

  let currentY = doc.lastAutoTable.finalY + 12;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.setTextColor(74, 222, 128);
  doc.text("2. Supplement Adherence Log Ledger (Recent History)", 14, currentY);

  const complianceRows = suppLogs.slice(0, 30).map(log => {
    const rawDate = new Date(log.date + 'T00:00:00');
    const formattedDate = rawDate.toLocaleDateString('en-GB', { weekday: 'short', month: 'short', day: 'numeric' });
    const componentsTaken = log.taken.map(id => { const s = supplements.find(x => x.id === id); return s ? s.name : null; }).filter(Boolean);
    return [formattedDate, componentsTaken.length ? componentsTaken.join(', ') : 'Zero intakes tracked.', `${componentsTaken.length} / ${supplements.length}`];
  });

  doc.autoTable({
    startY: currentY + 4,
    head: [['Date', 'Compounds Ingested Signature', 'Compliance Metric Score']],
    body: complianceRows.length ? complianceRows : [['No compliance intake events recorded yet.', '', '']],
    theme: 'striped',
    headStyles: { fillColor: [74, 222, 128], fontSize: 9 },
    styles: { fontSize: 8.5, cellPadding: 3 }
  });

  currentY = doc.lastAutoTable.finalY + 12;
  if (currentY > 240) { doc.addPage(); currentY = 20; }
  
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.setTextColor(56, 189, 248);
  doc.text("3. Rehabilitation Practice Performance Telemetry History", 14, currentY);

  const practiceRows = sessions.slice(0, 60).map(s => {
    const rawDate = new Date(s.date);
    const formattedDate = rawDate.toLocaleDateString('en-GB', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const innerDetailText = s.exercises.map(ex => `• ${ex.name} (${ex.sets} sets | Clocked: ${fmt(ex.time)})${ex.notes ? ' [Feedback: ' + ex.notes + ']' : ''}`).join('\n');
    return [formattedDate, fmt(s.duration), innerDetailText];
  });

  doc.autoTable({
    startY: currentY + 4,
    head: [['Session Timestamp', 'Duration', 'Executed Exercises Metrics & Clinical Feedback']],
    body: practiceRows.length ? practiceRows : [['No historical practice sessions completed.', '', '']],
    theme: 'striped',
    headStyles: { fillColor: [56, 189, 248], fontSize: 9 },
    styles: { fontSize: 8.5, cellPadding: 4, font: 'helvetica' },
    columnStyles: { 2: { cellWidth: 110 } }
  });

  doc.save(`rehab_telemetry_report_${todayStr()}.pdf`);
}

// --- LOCAL DATA BACKUP MANAGEMENT ---
async function exportDatabaseJSON() {
  await syncDatabaseMemory();
  const packagingBundle = { exercises, sessions, supplements, suppLogs };
  const rawStringData = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(packagingBundle));
  const hiddenAnchorNode = document.createElement('a');
  hiddenAnchorNode.setAttribute("href", rawStringData);
  hiddenAnchorNode.setAttribute("download", `rehabtrack_backup_${todayStr()}.json`);
  document.body.appendChild(hiddenAnchorNode);
  hiddenAnchorNode.click();
  hiddenAnchorNode.remove();
}

function importDatabaseJSON(fileSelectorElement) {
  const selectedFile = fileSelectorElement.files[0];
  if (!selectedFile) return;
  const dataReaderInstance = new FileReader();
  dataReaderInstance.onload = async function(event) {
    try {
      const parsedBundle = JSON.parse(event.target.result);
      if(!parsedBundle.exercises || !parsedBundle.sessions) { alert("Invalid backup structure."); return; }
      
      if(confirm("Confirm database overwrite? All current logs will be completely replaced.")) {
        await db.exercises.clear(); await db.sessions.clear(); await db.supplements.clear(); await db.suppLogs.clear();
        for(let item of parsedBundle.exercises) await db.exercises.put(item);
        for(let item of parsedBundle.sessions) await db.sessions.put(item);
        for(let item of parsedBundle.supplements) await db.supplements.put(item);
        for(let item of parsedBundle.suppLogs) await db.suppLogs.put(item);
        alert("Database restoration complete.");
        window.location.reload();
      }
    } catch(e) { alert("Error reading backup file."); }
  };
  dataReaderInstance.readAsText(selectedFile);
}

function confirm2(title,msg,cb){var div=document.createElement('div');div.className='confirm-overlay';div.innerHTML='<div class="confirm-box"><h3>'+title+'</h3><p>'+msg+'</p><div class="confirm-btns"><button class="btn btn-ghost" onclick="this.closest(\'.confirm-overlay\').remove()">Cancel</button><button class="btn btn-danger" id="cyes">Delete</button></div></div>';div.querySelector('#cyes').onclick=function(){div.remove();cb();};document.body.appendChild(div);}

window.addEventListener('DOMContentLoaded', async () => {
  await syncDatabaseMemory();
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='';
  renderEx();
});
</script>
