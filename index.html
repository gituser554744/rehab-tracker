<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RehabTrack">
<title>RehabTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c1018;--surf:#141b27;--surf2:#1c2537;--border:#263042;
  --accent:#38bdf8;
  --work:#22c55e;
  --stop:#ef4444;
  --rest:#f97316;
  --done:#4ade80;
  --danger:#f87171;
  --supp:#a78bfa;
  --text:#e2e8f0;--muted:#7a8ba3;--r:14px;--rs:8px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.view{display:none;padding:16px 16px 80px;}
.view.active{display:block;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
#loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{color:var(--muted);font-size:14px;font-weight:700;}
nav{display:flex;background:var(--surf);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);position:relative;z-index:10;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:20px;height:20px;stroke-width:2;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:24px;font-weight:900;letter-spacing:-.5px;}
.btn{border:none;border-radius:var(--rs);font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-work{background:var(--work);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-stop{background:var(--stop);color:#fff;padding:10px 18px;font-size:14px;}
.btn-done-p{background:var(--done);color:#0c1018;padding:10px 18px;font-size:14px;}
.btn-danger{background:var(--danger);color:#0c1018;padding:8px 14px;font-size:13px;}
.btn-ghost{background:var(--surf2);color:var(--text);padding:8px 14px;font-size:13px;border:1px solid var(--border);}
.btn-big{width:100%;padding:16px;font-size:17px;border-radius:var(--r);letter-spacing:.3px;}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;}
.tag-reps{background:#1e3a5f;color:var(--accent);}
.tag-time{background:#3b1f0a;color:var(--rest);}
.tag-area{background:#2d1f5e;color:var(--supp);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:48px;margin-bottom:12px;}
.empty h3{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text);}
.empty p{font-size:14px;line-height:1.5;}
/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-back.open{opacity:1;pointer-events:all;}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));width:100%;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.modal-back.open .modal{transform:translateY(0);}
.modal-title{font-size:20px;font-weight:900;margin-bottom:20px;}
.form-g{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-btn{padding:12px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:all .2s;}
.type-btn.sel-reps{border-color:var(--accent);color:var(--accent);background:#1e3a5f44;}
.type-btn.sel-time{border-color:var(--rest);color:var(--rest);background:#3b1f0a44;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal-actions .btn{flex:1;padding:14px;font-size:15px;border-radius:var(--r);}
/* PRACTICE IDLE */
.idle-header{text-align:center;padding:24px 0 16px;}
.idle-greeting{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.idle-prog{font-size:22px;font-weight:900;margin-bottom:4px;}
.idle-prog-sub{font-size:13px;color:var(--muted);}
.idle-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.idle-stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:12px 8px;text-align:center;}
.idle-stat-val{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--accent);line-height:1;}
.idle-stat-lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
.idle-ex-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.idle-ex-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.idle-ex-item:last-child{border-bottom:none;}
.idle-ex-num{width:24px;height:24px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
.idle-ex-name{flex:1;font-size:14px;font-weight:700;}
.idle-ex-detail{font-size:12px;color:var(--muted);}
.idle-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.repeat-btn{background:var(--surf2);border:1px solid var(--border);color:var(--text);padding:13px;font-size:14px;width:100%;border-radius:var(--r);}
.sound-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;font-size:13px;color:var(--muted);}
.sound-toggle-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);padding:6px 12px;font-size:18px;cursor:pointer;}
/* MOOD SELECT */
.mood-wrap{padding:20px 0 28px;text-align:center;}
.mood-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.mood-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.mood-row{display:flex;justify-content:center;gap:10px;}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:var(--r);border:2px solid var(--border);background:var(--surf2);cursor:pointer;transition:all .2s;min-width:54px;}
.mood-em{font-size:26px;line-height:1;}
.mood-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.mood-btn.sel{border-color:var(--accent);background:rgba(56,189,248,.1);}
/* ACTIVE PRACTICE */
.wa-prog{background:var(--surf);padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin:-16px -16px 0;}
.wa-prog-txt{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;}
.wa-bar{height:4px;background:var(--border);border-radius:2px;flex:1;overflow:hidden;}
.wa-fill{height:100%;border-radius:2px;transition:width .4s;}
.wa-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.session-elapsed{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);}
.sound-sm{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;}
.ex-content{padding:20px 0 0;}
.ex-big-name{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:6px;}
.ex-big-sub{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
/* READY PHASE */
.ready-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:28px;text-align:center;margin-bottom:20px;}
.ready-set{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.ready-detail{font-size:28px;font-weight:900;color:var(--work);}
.ready-sub{font-size:13px;color:var(--muted);margin-top:4px;}
/* RING */
.timer-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
.ring-container{position:relative;width:200px;height:200px;}
.ring-svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-prog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .35s linear,stroke .35s;}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-digits{font-family:'Orbitron',monospace;font-size:46px;font-weight:700;line-height:1;transition:color .35s;}
.ring-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:8px;text-align:center;}
/* REST STOPWATCH */
.rest-sw-wrap{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:var(--r);padding:24px 20px;text-align:center;margin-bottom:20px;}
.rest-sw-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--rest);margin-bottom:6px;}
.rest-sw-display{font-family:'Orbitron',monospace;font-size:54px;font-weight:700;color:var(--rest);line-height:1;margin-bottom:6px;}
.rest-sw-set{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:16px;}
.btn-rest-done{width:100%;padding:14px;font-size:15px;border-radius:var(--r);background:var(--rest);color:#fff;border:none;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;}
.btn-rest-done:active{transform:scale(.97);}
/* REPS CIRCLES */
.reps-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;gap:14px;}
.set-circles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.set-circ{width:58px;height:58px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);color:var(--muted);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Orbitron',monospace;}
.set-circ.active{border-color:var(--work);color:var(--work);box-shadow:0 0 0 3px rgba(34,197,94,.2);}
.set-circ.done{background:var(--work);border-color:var(--work);color:#0c1018;}
.reps-hint{font-size:13px;color:var(--muted);font-weight:700;}
.ex-elapsed{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:var(--muted);}
/* PAIN RATING */
.pain-wrap{margin-bottom:16px;}
.pain-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.pain-row{display:flex;gap:5px;}
.pain-btn{flex:1;padding:10px 2px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;text-align:center;transition:all .2s;}
.pain-btn.p0{border-color:var(--done);background:rgba(74,222,128,.15);color:var(--done);}
.pain-btn.p1{border-color:#86efac;background:rgba(134,239,172,.1);color:#86efac;}
.pain-btn.p2{border-color:#fde047;background:rgba(253,224,71,.1);color:#ca8a04;}
.pain-btn.p3{border-color:#fb923c;background:rgba(251,146,60,.1);color:#fb923c;}
.pain-btn.p4{border-color:#f87171;background:rgba(248,113,113,.1);color:var(--danger);}
.pain-btn.p5{border-color:#ef4444;background:rgba(239,68,68,.15);color:#ef4444;}
/* NOTES */
.notes-wrap{margin-bottom:20px;}
.notes-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.notes-ta{width:100%;padding:12px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;resize:none;outline:none;height:76px;user-select:text;-webkit-user-select:text;}
.notes-ta:focus{border-color:var(--accent);}
.wa-actions{display:flex;gap:10px;margin-top:8px;padding-bottom:16px;}
.wa-actions .btn{flex:1;padding:15px;font-size:15px;border-radius:var(--r);}
/* POST PRACTICE */
.post-wrap{padding:20px 0;}
.post-title{font-size:24px;font-weight:900;margin-bottom:4px;}
.post-sub{font-size:14px;color:var(--muted);margin-bottom:24px;}
.post-stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;}
.post-stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;}
.post-stat-row:last-child{border-bottom:none;}
.post-stat-lbl{color:var(--muted);font-weight:700;}
.post-stat-val{font-weight:900;}
.rating-wrap{margin-bottom:20px;}
.rating-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
.star-row{display:flex;gap:8px;justify-content:center;}
.star-btn{font-size:32px;background:none;border:none;cursor:pointer;opacity:.25;transition:opacity .2s,transform .1s;padding:4px;}
.star-btn.on{opacity:1;}
.star-btn:active{transform:scale(.9);}
/* EXERCISES */
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.prog-tab{flex-shrink:0;padding:8px 14px;border-radius:99px;border:2px solid var(--border);background:var(--surf2);color:var(--muted);font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .2s;}
.prog-tab.viewing{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1);}
.prog-tab.is-active::after{content:" °5";}
.prog-manage-btn{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surf2);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.ex-card-info{flex:1;min-width:0;}
.ex-card-name{font-size:16px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-card-meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ex-card-actions{display:flex;flex-direction:column;gap:4px;}
.icon-btn{width:34px;height:34px;border:none;border-radius:var(--rs);background:var(--surf2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:16px;height:16px;stroke-width:2.5;}
.order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.ord-btn{width:28px;height:22px;border:none;background:var(--surf2);color:var(--muted);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
/* SUPPLEMENTS */
.supp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.supp-card-info{flex:1;min-width:0;}
.supp-card-name{font-size:16px;font-weight:800;margin-bottom:3px;}
.supp-card-meta{font-size:13px;color:var(--muted);font-weight:600;}
.supp-card-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;}
.supp-actions{display:flex;flex-direction:column;gap:4px;}
.supp-chk{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0;}
.supp-chk.checked{background:var(--supp);border-color:var(--supp);}
.supp-day-header{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
/* HISTORY + DASHBOARD */
.export-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:20px;}
.export-bar .btn{padding:10px 6px;font-size:11px;text-align:center;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.dash-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:14px 10px;text-align:center;}
.dash-val{font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:3px;}
.dash-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.week-grid{display:flex;gap:4px;margin-bottom:20px;}
.week-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.week-day-lbl{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;}
.week-dot{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;}
.week-dot.done{background:var(--work);border-color:var(--work);}
.week-dot.today{border-color:var(--accent);}
.supp-bar{background:var(--surf);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.supp-bar-lbl{font-size:12px;font-weight:800;color:var(--muted);}
.supp-bar-val{font-size:13px;font-weight:900;color:var(--supp);}
.sess-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.sess-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.sess-date{font-size:15px;font-weight:900;}
.sess-meta{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
.sess-mood-stars{font-size:11px;color:var(--muted);margin-top:3px;}
.sess-chev{color:var(--muted);transition:transform .2s;flex-shrink:0;}
.sess-card.open .sess-chev{transform:rotate(180deg);}
.sess-body{display:none;padding:0 14px 14px;}
.sess-card.open .sess-body{display:block;}
.sess-ex{padding:9px 0;border-top:1px solid var(--border);}
.sess-ex-name{font-size:14px;font-weight:800;margin-bottom:2px;}
.sess-ex-meta{font-size:12px;color:var(--muted);margin-bottom:2px;}
.sess-ex-pain{font-size:12px;margin-bottom:2px;}
.sess-ex-notes{font-size:12px;font-style:italic;color:var(--muted);}
.sess-actions{display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border);}
.sess-actions .btn{flex:1;padding:10px;font-size:12px;}
/* PROGRAM MANAGE MODAL */
.prog-item{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.prog-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.prog-item-name{font-size:15px;font-weight:900;}
.prog-item-active{font-size:10px;font-weight:800;color:var(--work);text-transform:uppercase;letter-spacing:.6px;}
.prog-item-btns{display:flex;gap:6px;flex-wrap:wrap;}
.prog-item-btns .btn{font-size:11px;padding:7px 10px;}
/* CONFIRM + TOAST */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;}
.confirm-box{background:var(--surf);border-radius:var(--r);padding:24px;width:100%;max-width:340px;}
.confirm-box h3{font-size:18px;font-weight:900;margin-bottom:8px;}
.confirm-box p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns .btn{flex:1;padding:13px;font-size:14px;border-radius:var(--rs);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:var(--accent);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
textarea,input,select{-webkit-user-select:text;user-select:text;}

</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Loading RehabTrack&hellip;</p></div>
<div id="main" style="display:none">
  <!-- PRACTICE -->
  <div class="view active" id="view-practice">
    <div id="practice-root"></div>
  </div>
  <!-- EXERCISES -->
  <div class="view" id="view-exercises">
    <div class="page-header">
      <span class="page-title">Exercises</span>
      <button class="prog-manage-btn" onclick="openProgModal()" title="Manage Programs">&#9881;</button>
    </div>
    <div class="prog-row" id="prog-tabs"></div>
    <div id="ex-list"></div>
    <button class="btn btn-primary btn-big" onclick="openExModal()" style="margin-top:8px">+ Add Exercise</button>
  </div>
  <!-- SUPPLEMENTS -->
  <div class="view" id="view-supps">
    <div class="page-header">
      <span class="page-title">Supplements</span>
      <button class="btn btn-primary" onclick="openSuppModal()" style="background:var(--supp);font-size:13px">+ Add</button>
    </div>
    <div id="supp-content"></div>
  </div>
  <!-- HISTORY -->
  <div class="view" id="view-history">
    <div class="page-header"><span class="page-title">History</span></div>
    <div class="export-bar">
      <button class="btn btn-ghost" onclick="exportPDF()">&#128196; PDF</button>
      <button class="btn btn-ghost" onclick="exportCSV()">&#128202; CSV</button>
      <label class="btn btn-ghost" style="cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800">
        &#128229; Import
        <input type="file" accept=".json" onchange="handleImport(event)" style="display:none">
      </label>
    </div>
    <button class="btn btn-ghost" onclick="exportJSON()" style="width:100%;padding:11px;font-size:13px;margin-bottom:16px">&#128228; Share / Save JSON Backup</button>
    <div id="dashboard"></div>
    <div id="hist-list"></div>
  </div>
</div>
<!-- NAV -->
<nav>
  <button class="nav-btn active" id="nav-practice" onclick="goTo('practice')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>Practice
  </button>
  <button class="nav-btn" id="nav-exercises" onclick="goTo('exercises')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Exercises
  </button>
  <button class="nav-btn" id="nav-supps" onclick="goTo('supps')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>Supps
  </button>
  <button class="nav-btn" id="nav-history" onclick="goTo('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 8v4l3 3M3.05 11a9 9 0 1 0 .5-4"/><path d="M3 3v4h4"/></svg>History
  </button>
</nav>
<!-- EXERCISE MODAL -->
<div class="modal-back" id="ex-modal" onclick="if(event.target.id==='ex-modal')closeExModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="ex-modal-ttl">Add Exercise</div>
    <input type="hidden" id="ex-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="f-name" placeholder="e.g. Clamshells" maxlength="60" autocomplete="off"></div>
    <div class="form-g"><label class="form-label">Type</label><div class="type-toggle"><button class="type-btn sel-reps" id="t-reps" onclick="setExType('reps')">&#128170; Reps-Based</button><button class="type-btn" id="t-time" onclick="setExType('time')">&#9201; Time-Based</button></div></div>
    <div class="form-g"><label class="form-label">Body Area</label>
      <select class="form-input" id="f-area">
        <option value="Hip">Hip</option><option value="Knee">Knee</option><option value="Shoulder">Shoulder</option><option value="Core">Core</option><option value="Back">Back</option><option value="Full Body">Full Body</option><option value="Other">Other</option>
      </select>
    </div>
    <div class="form-g"><label class="form-label">Sets</label><input class="form-input" id="f-sets" type="number" min="1" max="20" placeholder="3"></div>
    <div id="reps-f"><div class="form-g"><label class="form-label">Reps per Set</label><input class="form-input" id="f-reps" type="number" min="1" max="200" placeholder="10"></div></div>
    <div id="time-f" style="display:none"><div class="form-row"><div class="form-g"><label class="form-label">Work (sec)</label><input class="form-input" id="f-work" type="number" min="1" max="600" placeholder="20"></div><div class="form-g"><label class="form-label">Rest (sec)</label><input class="form-input" id="f-rest" type="number" min="0" max="600" placeholder="10"></div></div></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeExModal()">Cancel</button><button class="btn btn-primary" onclick="saveExercise()">Save</button></div>
  </div>
</div>
<!-- SUPPLEMENT MODAL -->
<div class="modal-back" id="supp-modal" onclick="if(event.target.id==='supp-modal')closeSuppModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="supp-modal-ttl">Add Supplement</div>
    <input type="hidden" id="supp-edit-id">
    <div class="form-g"><label class="form-label">Name</label><input class="form-input" id="sf-name" placeholder="e.g. Vitamin D3" maxlength="60" autocomplete="off"></div>
    <div class="form-row"><div class="form-g"><label class="form-label">Dose</label><input class="form-input" id="sf-dose" placeholder="2000 IU" maxlength="30"></div><div class="form-g"><label class="form-label">Frequency</label><input class="form-input" id="sf-freq" placeholder="Daily" maxlength="30"></div></div>
    <div class="form-g"><label class="form-label">Timing (optional)</label><input class="form-input" id="sf-timing" placeholder="With breakfast" maxlength="60"></div>
    <div class="form-g"><label class="form-label">Notes (optional)</label><input class="form-input" id="sf-notes" placeholder="Take with fat" maxlength="120"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeSuppModal()">Cancel</button><button class="btn btn-primary" onclick="saveSupp()" style="background:var(--supp)">Save</button></div>
  </div>
</div>
<!-- PROGRAM MODAL -->
<div class="modal-back" id="prog-modal" onclick="if(event.target.id==='prog-modal')closeProgModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Programs</div>
    <div id="prog-list"></div>
    <button class="btn btn-primary btn-big" onclick="addProgram()" style="margin-top:8px">+ New Program</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost btn-big" onclick="closeProgModal()">Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

// ==================== DB ====================
var db = new Dexie('RehabTrackDB');
db.version(2).stores({ kv: 'key' });
var programs = [], sessions = [], supplements = [], suppLogs = [];
var soundEnabled = true;

function tryLS(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } }

async function loadAll() {
  var r = await db.kv.bulkGet(['programs','sessions','supplements','suppLogs','soundEnabled']);
  if (r[0]) {
    programs    = r[0].value || [];
    sessions    = r[1] ? r[1].value : [];
    supplements = r[2] ? r[2].value : [];
    suppLogs    = r[3] ? r[3].value : [];
    soundEnabled = r[4] ? r[4].value : true;
  } else {
    // Migrate from previous version
    var oldEx   = tryLS('rt_ex');
    sessions    = tryLS('rt_sess')  || [];
    supplements = tryLS('rt_supps') || [];
    suppLogs    = tryLS('rt_slogs') || [];
    var defExes = oldEx || [];
    programs = [{ id: uid(), name: 'My Program', exercises: defExes, isActive: true, createdAt: new Date().toISOString() }];
    if (defExes.length) await persistAll();
    ['rt_ex','rt_sess','rt_supps','rt_slogs'].forEach(function(k){ localStorage.removeItem(k); });
  }
  if (!programs.length) programs = [{ id: uid(), name: 'My Program', exercises: [], isActive: true, createdAt: new Date().toISOString() }];
}

async function persistAll() {
  await db.kv.bulkPut([
    { key: 'programs',      value: programs },
    { key: 'sessions',      value: sessions },
    { key: 'supplements',   value: supplements },
    { key: 'suppLogs',      value: suppLogs },
    { key: 'soundEnabled',  value: soundEnabled }
  ]);
}
function persist() { persistAll().catch(function(e){ console.warn('persist err',e); }); }

// ==================== UTILS ====================
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fmt(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-AU', { weekday:'long', month:'long', day:'numeric' }); }
function fmtDateTime(iso) { var d = new Date(iso); return d.toLocaleDateString('en-AU', { weekday:'short', month:'short', day:'numeric' }) + ' ' + d.toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit' }); }
function toast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); }, 2800); }
function confirm2(title, msg, cb) {
  var div = document.createElement('div');
  div.className = 'confirm-overlay';
  div.innerHTML = '<div class="confirm-box"><h3>' + title + '</h3><p>' + msg + '</p><div class="confirm-btns"><button class="btn btn-ghost" onclick="this.closest(\'.confirm-overlay\').remove()">Cancel</button><button class="btn btn-danger" id="cy">Confirm</button></div></div>';
  div.querySelector('#cy').onclick = function(){ div.remove(); cb(); };
  document.body.appendChild(div);
}
function painColor(p) { return ['#4ade80','#86efac','#fde047','#fb923c','#f87171','#ef4444'][p] || '#7a8ba3'; }
function painLabel(p) { return ['None','Mild','Moderate','Significant','Severe','Max'][p] || '—'; }
function stars(n, of) { var s = ''; for(var i=1;i<=of;i++) s += (i<=n ? '\u2605' : '\u2606'); return s; }

// ==================== AUDIO ====================
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, vol) {
  if (!soundEnabled || !audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
function playWorkEnd() { playTone(880, 0.5, 0.5); }
function playRestEnd() { playTone(659, 0.18, 0.4); setTimeout(function(){ playTone(880, 0.4, 0.5); }, 200); }
function playSetDone() { playTone(523, 0.08, 0.3); setTimeout(function(){ playTone(784, 0.18, 0.35); }, 110); }
function toggleSound() {
  soundEnabled = !soundEnabled;
  persist();
  var btn = document.getElementById('sound-btn');
  if (btn) btn.textContent = soundEnabled ? '\uD83D\uDD0A' : '\uD83D\uDD07';
  var idleBtn = document.getElementById('idle-sound-btn');
  if (idleBtn) idleBtn.textContent = soundEnabled ? '\uD83D\uDD0A' : '\uD83D\uDD07';
}

// ==================== NAVIGATION ====================
var VIEW = 'practice', viewedProgId = null;
function goTo(v) {
  document.querySelectorAll('.view').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(e){ e.classList.remove('active'); });
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  VIEW = v;
  if (v==='practice')  renderPractice();
  if (v==='exercises') renderExercises();
  if (v==='supps')     renderSupps();
  if (v==='history')   renderHistory();
}

// ==================== PRACTICE ENGINE ====================
var PS = null, gTimer = null, cTimer = null, swTimer = null;

function getActiveProg() { return programs.find(function(p){ return p.isActive; }) || programs[0]; }

function renderPractice() {
  var el = document.getElementById('practice-root');
  if (!el) return;
  if (!PS)                         renderPracticeIdle(el);
  else if (PS.status === 'mood')   renderMoodSelect(el);
  else if (PS.status === 'active') renderCurrentEx();
  else if (PS.status === 'rating') renderPostPractice(el);
  else if (PS.status === 'done')   renderPracticeDone(el);
}

function renderPracticeIdle(el) {
  var prog = getActiveProg();
  var streak = calcStreak();
  var total = sessions.length;
  var lastSess = sessions[0];
  var lastStr = lastSess ? fmtDate(lastSess.date) : 'Never';
  var lastProg = lastSess ? (lastSess.programName || 'Unknown') : '';
  var exList = prog.exercises.length
    ? prog.exercises.map(function(ex, i){
        return '<div class="idle-ex-item">' +
          '<div class="idle-ex-num">'+(i+1)+'</div>' +
          '<div class="idle-ex-name">'+ex.name+'</div>' +
          '<div class="idle-ex-detail">'+(ex.type==='reps'?ex.sets+'x'+ex.reps:ex.sets+'x'+ex.work+'s')+'</div>' +
          '</div>';
      }).join('')
    : '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">No exercises in this program.<br>Go to Exercises to add some.</div>';

  var repeatBtn = lastSess
    ? '<button class="btn repeat-btn" onclick="repeatLastSession()">&#128257; Repeat: '+lastProg+'</button>'
    : '';

  el.innerHTML =
    '<div class="idle-header">' +
      '<div class="idle-greeting">'+greeting()+'</div>' +
      '<div class="idle-prog">'+prog.name+(prog.isActive?' &#11088;':'')+'</div>' +
      '<div class="idle-prog-sub">' + prog.exercises.length + ' exercise' + (prog.exercises.length!==1?'s':'') + ' in this program</div>' +
    '</div>' +
    '<div class="idle-stats">' +
      '<div class="idle-stat"><div class="idle-stat-val">'+streak+'</div><div class="idle-stat-lbl">&#128293; Streak</div></div>' +
      '<div class="idle-stat"><div class="idle-stat-val">'+total+'</div><div class="idle-stat-lbl">Total</div></div>' +
      '<div class="idle-stat"><div class="idle-stat-val">' + (lastSess ? (Math.round(lastSess.duration/60)+'m') : '—') + '</div><div class="idle-stat-lbl">Last</div></div>' +
    '</div>' +
    '<div class="idle-ex-list">' + exList + '</div>' +
    '<div class="idle-btns">' +
      repeatBtn +
      '<button class="btn btn-work btn-big" onclick="initPractice()" style="font-size:17px">&#9654; Start Practice</button>' +
    '</div>' +
    '<div class="sound-row">Sound: <button class="sound-toggle-btn" id="idle-sound-btn" onclick="toggleSound()">'+(soundEnabled?'\uD83D\uDD0A':'\uD83D\uDD07')+'</button></div>';
}

function greeting() {
  var h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function initPractice() {
  var prog = getActiveProg();
  if (!prog.exercises.length) { toast('Add exercises first!'); goTo('exercises'); return; }
  PS = { status: 'mood' };
  renderPractice();
}

function repeatLastSession() {
  var lastSess = sessions[0];
  if (!lastSess) return;
  var prog = programs.find(function(p){ return p.id === lastSess.programId; });
  if (prog) {
    programs.forEach(function(p){ p.isActive = false; });
    prog.isActive = true;
    persist();
    toast('Switched to "'+prog.name+'"');
    initPractice();
  } else {
    confirm2('Recreate Program?', '"'+lastSess.programName+'" no longer exists. Recreate it from this session?', function() {
      var newProg = {
        id: uid(), name: lastSess.programName + ' (restored)',
        exercises: lastSess.exercises.map(function(ex){
          return { id: uid(), name: ex.name, type: ex.type, sets: ex.targetSets, reps: ex.targetReps||0, work: ex.targetWork||0, rest: ex.targetRest||0, area: ex.area||'' };
        }),
        isActive: true, createdAt: new Date().toISOString()
      };
      programs.forEach(function(p){ p.isActive = false; });
      programs.push(newProg);
      persist();
      toast('Program restored!');
      initPractice();
    });
  }
}

function renderMoodSelect(el) {
  el.innerHTML =
    '<div style="padding:16px 0">' +
    '<div class="mood-wrap">' +
      '<div class="mood-title">How are you feeling?</div>' +
      '<div class="mood-sub">Tap to record your energy before practice</div>' +
      '<div class="mood-row">' +
        ['&#128555;Rough','&#128532;Tired','&#128528;OK','&#128522;Good','&#128516;Great'].map(function(m,i){
          var parts = m.split('_'); // won't split since no underscore
          // m is like "&#128555;Rough"
          var em = m.slice(0, m.lastIndexOf(';')+1) || m.slice(0,8);
          // Actually let's just hardcode
          return '';
        }).join('') +
        '<button class="mood-btn" onclick="selectMood(1)"><span class="mood-em">&#128555;</span><span class="mood-lbl">Rough</span></button>' +
        '<button class="mood-btn" onclick="selectMood(2)"><span class="mood-em">&#128532;</span><span class="mood-lbl">Tired</span></button>' +
        '<button class="mood-btn" onclick="selectMood(3)"><span class="mood-em">&#128528;</span><span class="mood-lbl">OK</span></button>' +
        '<button class="mood-btn" onclick="selectMood(4)"><span class="mood-em">&#128522;</span><span class="mood-lbl">Good</span></button>' +
        '<button class="mood-btn" onclick="selectMood(5)"><span class="mood-em">&#128516;</span><span class="mood-lbl">Great</span></button>' +
      '</div>' +
    '</div>' +
    '</div>';
}

function selectMood(m) {
  ensureAudio();
  var prog = getActiveProg();
  clearAllTimers();
  PS = {
    status: 'active', mood: m,
    programId: prog.id, programName: prog.name,
    startTime: Date.now(), elapsed: 0,
    exs: JSON.parse(JSON.stringify(prog.exercises)),
    idx: 0,
    results: prog.exercises.map(function(ex){
      return { exerciseId:ex.id, name:ex.name, area:ex.area||'', type:ex.type, targetSets:ex.sets, targetReps:ex.reps||0, targetWork:ex.work||0, targetRest:ex.rest||0, setsCompleted:0, timeSpent:0, restIntervals:[], pain:0, notes:'' };
    }),
    phase: prog.exercises[0] ? (prog.exercises[0].type==='time' ? 'ready' : 'active') : 'active',
    curSet: 1, timeLeft: 0, phaseStart: null, exStart: Date.now(), restSWStart: null,
    rating: 0, sessionNotes: ''
  };
  gTimer = setInterval(function(){
    PS.elapsed = Math.floor((Date.now()-PS.startTime)/1000);
    var el = document.getElementById('session-elapsed');
    if (el) el.textContent = fmt(PS.elapsed);
    var exEl = document.getElementById('ex-elapsed');
    if (exEl && PS.exStart) exEl.textContent = fmt(Math.floor((Date.now()-PS.exStart)/1000));
  }, 1000);
  renderCurrentEx();
}

function renderCurrentEx() {
  var el = document.getElementById('practice-root');
  if (!el || !PS || PS.status !== 'active') return;
  var ex = PS.exs[PS.idx];
  var res = PS.results[PS.idx];
  var pct = Math.round((PS.idx/PS.exs.length)*100);
  var C = 2*Math.PI*88;

  var phaseHTML = '';
  if (PS.phase === 'ready') {
    phaseHTML = '<div class="ready-wrap">' +
      '<div class="ready-set">Set '+PS.curSet+' of '+ex.sets+'</div>' +
      '<div class="ready-detail">'+ex.work+'s <span style="color:var(--work)">work</span>' + (ex.rest>0?' &middot; '+ex.rest+'s <span style="color:var(--stop)">rest</span>':'') + '</div>' +
      '<div class="ready-sub">Tap Start when ready</div>' +
    '</div>';
  } else if (PS.phase === 'work' || PS.phase === 'rest') {
    var isW = PS.phase === 'work';
    var col = isW ? '#22c55e' : '#ef4444';
    var total = isW ? ex.work : ex.rest;
    var frac = total > 0 ? PS.timeLeft/total : 0;
    var off = C*(1-Math.max(0,frac));
    phaseHTML = '<div class="timer-wrap"><div class="ring-container">' +
      '<svg class="ring-svg" width="200" height="200" viewBox="0 0 200 200">' +
        '<circle class="ring-bg" cx="100" cy="100" r="88"/>' +
        '<circle class="ring-prog" id="rp" cx="100" cy="100" r="88" stroke="'+col+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/>' +
      '</svg>' +
      '<div class="ring-inner"><div class="ring-digits" id="rd" style="color:'+col+'">'+fmt(PS.timeLeft)+'</div>' +
      '<div class="ring-label" id="rl">'+(isW?'WORK':'REST')+' &bull; Set '+PS.curSet+' of '+ex.sets+'</div></div>' +
      '</div></div>';
  } else if (PS.phase === 'rest_sw') {
    var swE = PS.restSWStart ? Math.floor((Date.now()-PS.restSWStart)/1000) : 0;
    var isLastEx = PS.idx >= PS.exs.length-1;
    var doneLabel = (PS.curSet >= ex.sets) ? (isLastEx ? 'Finish Practice' : 'Next Exercise &#8594;') : 'Start Set '+(PS.curSet+1);
    var circlesHTML = '';
    if (ex.type === 'reps') {
      circlesHTML = '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:14px">' +
        Array.from({length:ex.sets}, function(_,i){ return '<div class="set-circ '+(i<PS.curSet?'done':'')+'">'+( i<PS.curSet?'&#10003;':i+1)+'</div>'; }).join('') +
        '</div>';
    }
    phaseHTML = circlesHTML +
      '<div class="rest-sw-wrap">' +
        '<div class="rest-sw-label">&#128308; Resting &mdash; Set '+PS.curSet+' complete</div>' +
        '<div class="rest-sw-display" id="rest-sw-display">'+fmt(swE)+'</div>' +
        '<div class="rest-sw-set">Rest interval being recorded</div>' +
        '<button class="btn-rest-done" onclick="endRestSW()">&#9654; '+doneLabel+'</button>' +
      '</div>';
  } else if (PS.phase === 'active') {
    var circles = Array.from({length:ex.sets}, function(_,i){
      var done = i < PS.curSet-1, active = i === PS.curSet-1;
      return '<div class="set-circ'+(done?' done':active?' active':'')+'"'+(active?' onclick="tapRepCircle('+i+')"':'')+'>'+( done?'&#10003;':i+1)+'</div>';
    }).join('');
    var exE = PS.exStart ? Math.floor((Date.now()-PS.exStart)/1000) : 0;
    phaseHTML = '<div class="reps-wrap"><div class="set-circles">'+circles+'</div>' +
      '<div class="reps-hint">'+ex.reps+' reps per set &bull; tap circle when set done</div>' +
      '<div class="ex-elapsed" id="ex-elapsed">'+fmt(exE)+'</div></div>';
  }

  var painBtns = '<div class="pain-wrap"><div class="pain-lbl">Pain / Discomfort (0=None, 5=Max)</div><div class="pain-row">' +
    [0,1,2,3,4,5].map(function(v){
      return '<button class="pain-btn'+(res.pain===v?' p'+v:'')+'" onclick="setPain('+v+')">'+v+'</button>';
    }).join('') + '</div></div>';

  var actionBtns = '';
  var skipBtn = '<button class="btn btn-ghost" onclick="skipExercise()">Skip</button>';
  if (PS.phase === 'ready') {
    actionBtns = skipBtn + '<button class="btn btn-work" onclick="startWork()">&#9654; Start Set '+PS.curSet+'</button>';
  } else if (PS.phase === 'work') {
    actionBtns = skipBtn + '<button class="btn btn-work" style="opacity:.4;pointer-events:none">&#9889; Working&hellip;</button>';
  } else if (PS.phase === 'rest') {
    actionBtns = skipBtn + '<button class="btn btn-stop" style="opacity:.4;pointer-events:none">&#128308; Rest&hellip;</button>';
  } else if (PS.phase === 'rest_sw' || PS.phase === 'active') {
    actionBtns = skipBtn;
  }

  el.innerHTML =
    '<div class="wa-prog">' +
      '<span class="wa-prog-txt">'+(PS.idx+1)+' / '+PS.exs.length+'</span>' +
      '<div class="wa-bar"><div class="wa-fill" style="width:'+pct+'%;background:var(--work)"></div></div>' +
      '<div class="wa-right"><span class="session-elapsed" id="session-elapsed">'+fmt(PS.elapsed)+'</span>' +
        '<button class="sound-sm" id="sound-btn" onclick="toggleSound()">'+(soundEnabled?'\uD83D\uDD0A':'\uD83D\uDD07')+'</button></div>' +
    '</div>' +
    '<div class="ex-content">' +
      '<div class="ex-big-name">'+ex.name+'</div>' +
      '<div class="ex-big-sub"><span class="tag tag-area">'+(ex.area||'General')+'</span>' +
        (ex.type==='reps' ? ex.sets+' sets &times; '+ex.reps+' reps' : ex.sets+' sets &middot; '+ex.work+'s / '+ex.rest+'s') +
      '</div>' +
      phaseHTML +
      painBtns +
      '<div class="notes-wrap"><div class="notes-lbl">Notes</div>' +
        '<textarea class="notes-ta" id="ex-notes" placeholder="Form, pain, observations&hellip;">'+(res.notes||'')+'</textarea>' +
      '</div>' +
    '</div>' +
    '<div class="wa-actions">'+actionBtns+'</div>';
}

function updateRingDisplay() {
  var ex = PS.exs[PS.idx];
  var C = 2*Math.PI*88;
  var isW = PS.phase === 'work';
  var col = isW ? '#22c55e' : '#ef4444';
  var total = isW ? ex.work : ex.rest;
  var frac = total>0 ? PS.timeLeft/total : 0;
  var off = C*(1-Math.max(0,frac));
  var rp=document.getElementById('rp'), rd=document.getElementById('rd'), rl=document.getElementById('rl');
  if (rp) { rp.style.stroke=col; rp.style.strokeDashoffset=off; }
  if (rd) { rd.style.color=col; rd.textContent=fmt(PS.timeLeft); }
  if (rl) { rl.textContent=(isW?'WORK':'REST')+' \u2022 Set '+PS.curSet+' of '+ex.sets; }
}

function startWork() {
  var ex = PS.exs[PS.idx];
  PS.phase = 'work'; PS.timeLeft = ex.work; PS.phaseStart = Date.now();
  ensureAudio();
  clearInterval(cTimer);
  cTimer = setInterval(function(){
    PS.timeLeft = Math.max(0, ex.work - Math.floor((Date.now()-PS.phaseStart)/1000));
    updateRingDisplay();
    if (PS.timeLeft <= 0) {
      clearInterval(cTimer);
      playWorkEnd();
      if (ex.rest > 0) startRestTimer(); else startRestSW();
    }
  }, 200);
  updateRingDisplay();
}

function startRestTimer() {
  var ex = PS.exs[PS.idx];
  PS.phase = 'rest'; PS.timeLeft = ex.rest; PS.phaseStart = Date.now();
  clearInterval(cTimer);
  cTimer = setInterval(function(){
    PS.timeLeft = Math.max(0, ex.rest - Math.floor((Date.now()-PS.phaseStart)/1000));
    updateRingDisplay();
    if (PS.timeLeft <= 0) {
      clearInterval(cTimer);
      playRestEnd();
      startRestSW();
    }
  }, 200);
  updateRingDisplay();
}

function startRestSW() {
  PS.phase = 'rest_sw'; PS.restSWStart = Date.now();
  clearInterval(swTimer);
  swTimer = setInterval(function(){
    var el = document.getElementById('rest-sw-display');
    if (el) el.textContent = fmt(Math.floor((Date.now()-PS.restSWStart)/1000));
  }, 500);
  renderCurrentEx();
}

function endRestSW() {
  var restTime = PS.restSWStart ? Math.floor((Date.now()-PS.restSWStart)/1000) : 0;
  PS.results[PS.idx].restIntervals.push(restTime);
  clearInterval(swTimer); swTimer = null; PS.restSWStart = null;
  var ex = PS.exs[PS.idx];
  if (PS.curSet >= ex.sets) finishCurrentEx();
  else { PS.curSet++; PS.phase = ex.type==='time' ? 'ready' : 'active'; renderCurrentEx(); }
}

function tapRepCircle(i) {
  if (PS.phase !== 'active') return;
  if (i !== PS.curSet-1) return;
  ensureAudio(); playSetDone();
  startRestSW();
}

function setPain(val) {
  if (!PS || PS.status !== 'active') return;
  PS.results[PS.idx].pain = val;
  document.querySelectorAll('.pain-btn').forEach(function(b,i){ b.className='pain-btn'+(i===val?' p'+val:''); });
}

function saveExNotes() {
  var ta = document.getElementById('ex-notes');
  if (ta && PS && PS.status==='active') PS.results[PS.idx].notes = ta.value;
}

function skipExercise() {
  saveExNotes(); clearInterval(cTimer); clearInterval(swTimer);
  if (PS.restSWStart) { PS.results[PS.idx].restIntervals.push(0); PS.restSWStart=null; }
  PS.results[PS.idx].timeSpent = PS.exStart ? Math.floor((Date.now()-PS.exStart)/1000) : 0;
  if (PS.idx >= PS.exs.length-1) { clearAllTimers(); PS.totalTime=Math.floor((Date.now()-PS.startTime)/1000); PS.status='rating'; renderPractice(); }
  else { PS.idx++; PS.curSet=1; PS.phase=PS.exs[PS.idx].type==='time'?'ready':'active'; PS.exStart=Date.now(); renderCurrentEx(); }
}

function finishCurrentEx() {
  saveExNotes();
  var res = PS.results[PS.idx];
  res.setsCompleted = PS.curSet;
  res.timeSpent = PS.exStart ? Math.floor((Date.now()-PS.exStart)/1000) : 0;
  clearInterval(cTimer); clearInterval(swTimer);
  if (PS.idx >= PS.exs.length-1) { clearAllTimers(); PS.totalTime=Math.floor((Date.now()-PS.startTime)/1000); PS.status='rating'; renderPractice(); }
  else { PS.idx++; PS.curSet=1; PS.phase=PS.exs[PS.idx].type==='time'?'ready':'active'; PS.exStart=Date.now(); renderCurrentEx(); }
}

function renderPostPractice(el) {
  var done = PS.results.filter(function(r){ return r.setsCompleted>0; });
  var rows = done.map(function(r){
    return '<div class="post-stat-row"><span class="post-stat-lbl">'+r.name+'</span>' +
      '<span class="post-stat-val">'+r.setsCompleted+' sets &middot; '+fmt(r.timeSpent)+(r.pain>0?' &middot; Pain:'+r.pain:'')+'</span></div>';
  }).join('');
  el.innerHTML =
    '<div class="post-wrap">' +
    '<div class="post-title">Practice Complete! &#127881;</div>' +
    '<div class="post-sub">'+fmt(PS.totalTime)+' &middot; '+done.length+' exercise'+(done.length!==1?'s':'')+' completed</div>' +
    '<div class="post-stat">'+rows+'</div>' +
    '<div class="rating-wrap"><div class="rating-lbl">Overall session rating</div><div class="star-row">' +
      [1,2,3,4,5].map(function(v){ return '<button class="star-btn'+(PS.rating>=v?' on':'')+'" id="star-'+v+'" onclick="setRating('+v+')">\u2605</button>'; }).join('') +
    '</div></div>' +
    '<div class="notes-wrap"><div class="notes-lbl">Session Notes (optional)</div>' +
      '<textarea class="notes-ta" id="sess-notes" placeholder="How was the overall session?">'+(PS.sessionNotes||'')+'</textarea>' +
    '</div>' +
    '<button class="btn btn-work btn-big" onclick="savePractice()">Save &amp; Finish</button>' +
    '</div>';
}

function setRating(v) {
  PS.rating = v;
  [1,2,3,4,5].forEach(function(i){ var el=document.getElementById('star-'+i); if(el) el.className='star-btn'+(i<=v?' on':''); });
}

function savePractice() {
  var ta = document.getElementById('sess-notes');
  if (ta) PS.sessionNotes = ta.value;
  var sess = {
    id: uid(),
    date: new Date(PS.startTime).toISOString(),
    endTime: new Date().toISOString(),
    duration: PS.totalTime,
    mood: PS.mood,
    rating: PS.rating,
    notes: PS.sessionNotes,
    programId: PS.programId,
    programName: PS.programName,
    exercises: PS.results
  };
  sessions.unshift(sess);
  PS = { status: 'done', sess: sess };
  persist();
  renderPractice();
}

function renderPracticeDone(el) {
  el.innerHTML = '<div style="text-align:center;padding:60px 20px">' +
    '<div style="font-size:64px;margin-bottom:16px">&#127881;</div>' +
    '<div style="font-size:24px;font-weight:900;margin-bottom:8px">Well done!</div>' +
    '<div style="font-size:14px;color:var(--muted);margin-bottom:32px">Practice saved to history</div>' +
    '<button class="btn btn-work btn-big" onclick="resetPractice()" style="margin-bottom:12px">Start New Practice</button>' +
    '<button class="btn btn-ghost btn-big" onclick="goTo(\'history\')">View History</button>' +
    '</div>';
}

function resetPractice() { PS = null; clearAllTimers(); renderPractice(); }
function clearAllTimers() { clearInterval(gTimer); clearInterval(cTimer); clearInterval(swTimer); gTimer=cTimer=swTimer=null; }

// ==================== PROGRAMS + EXERCISES ====================
function renderExercises() {
  renderProgTabs();
  var prog = getViewedProg();
  var el = document.getElementById('ex-list');
  if (!prog.exercises.length) {
    el.innerHTML = '<div class="empty"><div class="ei">&#127947;</div><h3>No exercises yet</h3><p>Tap <strong>+ Add Exercise</strong> below.</p></div>';
    return;
  }
  el.innerHTML = prog.exercises.map(function(ex,i){
    return '<div class="ex-card">' +
      '<div class="order-btns"><button class="ord-btn" onclick="moveExercise(\''+ex.id+'\',-1)" '+(i===0?'style="opacity:.25;pointer-events:none"':'')+'>&#9650;</button>' +
      '<button class="ord-btn" onclick="moveExercise(\''+ex.id+'\',1)" '+(i===prog.exercises.length-1?'style="opacity:.25;pointer-events:none"':'')+'>&#9660;</button></div>' +
      '<div class="ex-card-info"><div class="ex-card-name">'+ex.name+'</div>' +
        '<div class="ex-card-meta"><span class="tag '+(ex.type==='reps'?'tag-reps':'tag-time')+'">'+ex.type+'</span>' +
        '<span class="tag tag-area">'+(ex.area||'General')+'</span>' +
        (ex.type==='reps'?ex.sets+' sets &times; '+ex.reps+' reps':ex.sets+' sets &middot; '+ex.work+'s / '+ex.rest+'s')+'</div>' +
      '</div>' +
      '<div class="ex-card-actions">' +
        '<button class="icon-btn" onclick="openExModal(\''+ex.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>' +
        '<button class="icon-btn" style="color:var(--danger)" onclick="deleteExercise(\''+ex.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>' +
      '</div></div>';
  }).join('');
}

function getViewedProg() {
  if (viewedProgId) { var p = programs.find(function(x){ return x.id===viewedProgId; }); if (p) return p; }
  return getActiveProg();
}

function renderProgTabs() {
  var el = document.getElementById('prog-tabs');
  var viewed = getViewedProg();
  el.innerHTML = programs.map(function(p){
    return '<button class="prog-tab'+(p.isActive?' is-active':'')+(p.id===viewed.id?' viewing':'')+'" onclick="switchViewedProg(\''+p.id+'\')">'+p.name+'</button>';
  }).join('') + '<button class="prog-tab" onclick="openProgModal()" style="border-style:dashed">&#43; Program</button>';
}

function switchViewedProg(id) { viewedProgId = id; renderExercises(); }

function setActiveProgram(id) {
  programs.forEach(function(p){ p.isActive = (p.id === id); });
  persist();
  renderExercises();
  toast('Active program updated');
}

function addProgram() {
  var name = prompt('Program name:', 'Phase ' + (programs.length+1));
  if (!name || !name.trim()) return;
  var np = { id: uid(), name: name.trim(), exercises: [], isActive: false, createdAt: new Date().toISOString() };
  programs.push(np);
  viewedProgId = np.id;
  persist(); closeProgModal(); renderExercises();
}

function duplicateProgram(id) {
  var p = programs.find(function(x){ return x.id===id; });
  if (!p) return;
  var copy = JSON.parse(JSON.stringify(p));
  copy.id = uid(); copy.name = 'Copy of '+p.name; copy.isActive = false; copy.createdAt = new Date().toISOString();
  copy.exercises = copy.exercises.map(function(ex){ return Object.assign({}, ex, { id: uid() }); });
  programs.push(copy);
  persist(); renderProgList(); renderProgTabs();
  toast('Duplicated as "'+copy.name+'"');
}

function renameProgram(id) {
  var p = programs.find(function(x){ return x.id===id; });
  if (!p) return;
  var name = prompt('New name:', p.name);
  if (!name || !name.trim()) return;
  p.name = name.trim();
  persist(); renderProgList(); renderProgTabs();
}

function deleteProgram(id) {
  if (programs.length <= 1) { toast('Cannot delete the only program.'); return; }
  var p = programs.find(function(x){ return x.id===id; });
  confirm2('Delete "'+p.name+'"?', 'This program and all its exercises will be removed. History is unaffected.', function(){
    programs = programs.filter(function(x){ return x.id!==id; });
    if (!programs.find(function(x){ return x.isActive; })) programs[0].isActive = true;
    if (viewedProgId === id) viewedProgId = null;
    persist(); closeProgModal(); renderExercises();
  });
}

function openProgModal() {
  renderProgList();
  document.getElementById('prog-modal').classList.add('open');
}
function closeProgModal() { document.getElementById('prog-modal').classList.remove('open'); }

function renderProgList() {
  var el = document.getElementById('prog-list');
  if (!el) return;
  el.innerHTML = programs.map(function(p){
    return '<div class="prog-item">' +
      '<div class="prog-item-header">' +
        '<span class="prog-item-name">'+p.name+'</span>' +
        (p.isActive ? '<span class="prog-item-active">&#11088; Active</span>' : '') +
      '</div>' +
      '<div class="prog-item-btns">' +
        (!p.isActive ? '<button class="btn btn-primary" onclick="setActiveProgram(\''+p.id+'\')" style="font-size:11px;padding:7px 10px">Set Active</button>' : '') +
        '<button class="btn btn-ghost" onclick="duplicateProgram(\''+p.id+'\')">&#128203; Duplicate</button>' +
        '<button class="btn btn-ghost" onclick="renameProgram(\''+p.id+'\')">Rename</button>' +
        (!p.isActive ? '<button class="btn btn-danger" onclick="deleteProgram(\''+p.id+'\')">Delete</button>' : '') +
      '</div></div>';
  }).join('');
}

var selExType = 'reps';
function openExModal(id) {
  document.getElementById('ex-modal-ttl').textContent = id ? 'Edit Exercise' : 'Add Exercise';
  document.getElementById('ex-edit-id').value = id || '';
  if (id) {
    var prog = getViewedProg();
    var ex = prog.exercises.find(function(e){ return e.id===id; });
    if (!ex) return;
    document.getElementById('f-name').value = ex.name;
    document.getElementById('f-area').value = ex.area || 'Hip';
    document.getElementById('f-sets').value = ex.sets;
    setExType(ex.type);
    if (ex.type==='reps') document.getElementById('f-reps').value = ex.reps;
    else { document.getElementById('f-work').value = ex.work; document.getElementById('f-rest').value = ex.rest; }
  } else {
    ['f-name','f-sets','f-reps','f-work','f-rest'].forEach(function(i){ document.getElementById(i).value=''; });
    document.getElementById('f-area').value = 'Hip';
    setExType('reps');
  }
  document.getElementById('ex-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('f-name').focus(); }, 350);
}
function closeExModal() { document.getElementById('ex-modal').classList.remove('open'); }
function setExType(t) {
  selExType = t;
  document.getElementById('t-reps').className = 'type-btn'+(t==='reps'?' sel-reps':'');
  document.getElementById('t-time').className = 'type-btn'+(t==='time'?' sel-time':'');
  document.getElementById('reps-f').style.display = t==='reps' ? '' : 'none';
  document.getElementById('time-f').style.display = t==='time' ? '' : 'none';
}
function saveExercise() {
  var name = document.getElementById('f-name').value.trim();
  var sets = parseInt(document.getElementById('f-sets').value)||0;
  var area = document.getElementById('f-area').value;
  if (!name) { alert('Please enter a name.'); return; }
  if (sets<1) { alert('Sets must be at least 1.'); return; }
  var extra = {};
  if (selExType==='reps') { var reps=parseInt(document.getElementById('f-reps').value)||0; if(reps<1){alert('Reps must be at least 1.');return;} extra={reps:reps}; }
  else { var work=parseInt(document.getElementById('f-work').value)||0, rest=parseInt(document.getElementById('f-rest').value)||0; if(work<1){alert('Work must be at least 1s.');return;} extra={work:work,rest:rest}; }
  var prog = getViewedProg();
  var id = document.getElementById('ex-edit-id').value;
  if (id) {
    var idx = prog.exercises.findIndex(function(e){ return e.id===id; });
    prog.exercises[idx] = Object.assign({}, prog.exercises[idx], {name:name,sets:sets,area:area,type:selExType},extra);
  } else {
    prog.exercises.push(Object.assign({id:uid(),name:name,sets:sets,area:area,type:selExType},extra));
  }
  persist(); closeExModal(); renderExercises();
}
function deleteExercise(id) {
  var prog = getViewedProg();
  var ex = prog.exercises.find(function(e){ return e.id===id; });
  confirm2('Delete "'+ex.name+'"?','This exercise will be removed from this program.',function(){
    prog.exercises = prog.exercises.filter(function(e){ return e.id!==id; });
    persist(); renderExercises();
  });
}
function moveExercise(id, dir) {
  var prog = getViewedProg();
  var i = prog.exercises.findIndex(function(e){ return e.id===id; }), j=i+dir;
  if (j<0||j>=prog.exercises.length) return;
  var t=prog.exercises[i]; prog.exercises[i]=prog.exercises[j]; prog.exercises[j]=t;
  persist(); renderExercises();
}

// ==================== SUPPLEMENTS ====================
function getTodayLog() {
  var t = todayStr(), log = suppLogs.find(function(l){ return l.date===t; });
  if (!log) { log={date:t,taken:[]}; suppLogs.unshift(log); }
  return log;
}
function renderSupps() {

  var today = new Date().toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric'});

    supplements.map(function(s){
      var entry = log.taken.find(function(t){ return t.id===s.id; });
      var checked = !!entry;
      var timeStr = checked ? (' &mdash; '+new Date(entry.time).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})) : '';
      return '<div class="supp-card">' +
        '<div class="supp-chk '+(checked?'checked':'')+'" onclick="toggleSupp(\''+s.id+'\')">'+(checked?'&#10003;':'&#9675;')+'</div>' +
        '<div class="supp-card-info"><div class="supp-card-name">'+s.name+'</div>' +
          '<div class="supp-card-meta">'+(s.dose||'')+(s.freq?' &middot; '+s.freq:'')+(s.timing?' &middot; '+s.timing:'')+(checked?'<span style="color:var(--supp)">'+timeStr+'</span>':'')+'</div>' +
          (s.notes?'<div class="supp-card-note">'+s.notes+'</div>':'')+'</div>' +
        '<div class="supp-actions">' +
          '<button class="icon-btn" onclick="openSuppModal(\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>' +
          '<button class="icon-btn" style="color:var(--danger)" onclick="deleteSupp(\''+s.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>' +
        '</div></div>';
    }).join('') +
    '<div style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">'+log.taken.length+' of '+supplements.length+' taken today</div>';
}
function toggleSupp(id) {
  var log = getTodayLog(), idx = log.taken.findIndex(function(t){ return t.id===id; });
  if (idx>-1) log.taken.splice(idx,1); else log.taken.push({id:id,time:new Date().toISOString()});
  persist(); renderSupps();
}
function openSuppModal(id) {
  document.getElementById('supp-modal-ttl').textContent = id ? 'Edit Supplement' : 'Add Supplement';
  document.getElementById('supp-edit-id').value = id||'';
  if (id) { var s=supplements.find(function(x){return x.id===id;}); document.getElementById('sf-name').value=s.name; document.getElementById('sf-dose').value=s.dose||''; document.getElementById('sf-freq').value=s.freq||''; document.getElementById('sf-timing').value=s.timing||''; document.getElementById('sf-notes').value=s.notes||''; }
  else { ['sf-name','sf-dose','sf-freq','sf-timing','sf-notes'].forEach(function(i){document.getElementById(i).value='';}); }
  document.getElementById('supp-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('sf-name').focus(); }, 350);
}
function closeSuppModal() { document.getElementById('supp-modal').classList.remove('open'); }
function saveSupp() {
  var name = document.getElementById('sf-name').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  var s = {name:name,dose:document.getElementById('sf-dose').value.trim(),freq:document.getElementById('sf-freq').value.trim(),timing:document.getElementById('sf-timing').value.trim(),notes:document.getElementById('sf-notes').value.trim()};
  var id = document.getElementById('supp-edit-id').value;
  if (id) { var i=supplements.findIndex(function(x){return x.id===id;}); supplements[i]=Object.assign({},supplements[i],s); }
  else supplements.push(Object.assign({id:uid()},s));
  persist(); closeSuppModal(); if(VIEW==='supps') renderSupps();
}
function deleteSupp(id) {
  var s=supplements.find(function(x){return x.id===id;});
  confirm2('Delete "'+s.name+'"?','Removed from supplements.',function(){supplements=supplements.filter(function(x){return x.id!==id;});persist();renderSupps();});
}

// ==================== HISTORY + DASHBOARD ====================
function calcStreak() {
  var today = todayStr(), streak = 0, d = new Date();
  for (var i=0; i<365; i++) {
    var ds = d.toISOString().slice(0,10);
    var hasSess = sessions.some(function(s){ return s.date.slice(0,10)===ds; });
    if (hasSess) streak++;
    else if (i>0) break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function calcBestStreak() {
  if (!sessions.length) return 0;
  var dates = sessions.map(function(s){ return s.date.slice(0,10); }).filter(function(v,i,a){ return a.indexOf(v)===i; }).sort().reverse();
  var best=1,cur=1;
  for (var i=1;i<dates.length;i++) {
    var a=new Date(dates[i-1]),b=new Date(dates[i]);
    var diff = Math.round((a-b)/(1000*60*60*24));
    if (diff===1) { cur++; if(cur>best) best=cur; } else cur=1;
  }
  return best;
}
function calcSuppAdherence(days) {
  if (!supplements.length) return null;
  var total=0, taken=0;
  for (var i=0;i<days;i++) {
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=d.toISOString().slice(0,10);
    var log=suppLogs.find(function(l){return l.date===ds;});
    total+=supplements.length;
    taken+=(log?log.taken.length:0);
  }
  return total>0 ? Math.round((taken/total)*100) : null;
}

function renderHistory() {
  renderDashboard();
  var el = document.getElementById('hist-list');
  if (!sessions.length) { el.innerHTML='<div class="empty"><div class="ei">&#128202;</div><h3>No sessions yet</h3><p>Complete a practice and it will appear here.</p></div>'; return; }
  el.innerHTML = sessions.map(function(s){
    var d=new Date(s.date);
    var ds=d.toLocaleDateString('en-AU',{weekday:'long',month:'long',day:'numeric'});
    var ts=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
    var moodEm=['','&#128555;','&#128532;','&#128528;','&#128522;','&#128516;'][s.mood||0]||'';
    var ratingStars=s.rating?stars(s.rating,5):'';
    var exRows=s.exercises.map(function(ex){
      var restAvg=ex.restIntervals&&ex.restIntervals.length ? Math.round(ex.restIntervals.reduce(function(a,b){return a+b;},0)/ex.restIntervals.length) : 0;
      return '<div class="sess-ex">' +
        '<div class="sess-ex-name">'+ex.name+(ex.area?' <span style="font-size:11px;color:var(--supp)">('+ex.area+')</span>':'')+'</div>' +
        '<div class="sess-ex-meta">'+ex.setsCompleted+' sets &middot; '+fmt(ex.timeSpent)+(restAvg?' &middot; avg rest '+restAvg+'s':'')+'</div>' +
        (ex.pain>0?'<div class="sess-ex-pain" style="color:'+painColor(ex.pain)+'">Pain: '+ex.pain+'/5 &mdash; '+painLabel(ex.pain)+'</div>':'') +
        (ex.notes?'<div class="sess-ex-notes">&#128221; '+ex.notes+'</div>':'') +
      '</div>';
    }).join('');
    return '<div class="sess-card" id="sc-'+s.id+'">' +
      '<div class="sess-head" onclick="toggleSession(\''+s.id+'\')">' +
        '<div><div class="sess-date">'+ds+'</div>' +
          '<div class="sess-meta">'+ts+' &bull; '+(s.programName||'')+'&bull; '+fmt(s.duration)+'</div>' +
          '<div class="sess-mood-stars">'+(moodEm?'Mood: '+moodEm:'')+(ratingStars?' &nbsp;Rating: '+ratingStars:'')+'</div>' +
        '</div>' +
        '<svg class="sess-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</div>' +
      '<div class="sess-body">'+exRows+
        (s.notes?'<div style="margin-top:10px;font-size:13px;font-style:italic;color:var(--muted)">&#128221; '+s.notes+'</div>':'') +
        '<div class="sess-actions">' +
          '<button class="btn btn-primary" onclick="repeatSession(\''+s.id+'\')" style="font-size:11px">&#128257; Repeat Program</button>' +
          '<button class="btn btn-danger" onclick="deleteSession(\''+s.id+'\')" style="font-size:11px">Delete</button>' +
        '</div>' +
      '</div></div>';
  }).join('');
}

function renderDashboard() {
  var el = document.getElementById('dashboard');
  var streak=calcStreak(), best=calcBestStreak(), total=sessions.length;
  var avgDur = total ? Math.round(sessions.reduce(function(a,s){return a+s.duration;},0)/total/60) : 0;
  var adh7 = calcSuppAdherence(7), adh30 = calcSuppAdherence(30);
  // Week grid
  var days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var today=new Date(), todayDay=today.getDay();
  var mondayOffset=(todayDay===0)?6:todayDay-1;
  var weekHTML='';
  for(var i=0;i<7;i++){
    var d=new Date(today); d.setDate(today.getDate()-mondayOffset+i);
    var ds=d.toISOString().slice(0,10);
    var hasSess=sessions.some(function(s){return s.date.slice(0,10)===ds;});
    var isToday=ds===todayStr();
    weekHTML+='<div class="week-day"><div class="week-day-lbl">'+days[i]+'</div>' +
      '<div class="week-dot'+(hasSess?' done':'')+(isToday?' today':'')+'">'+( hasSess?'&#10003;':'')+'</div></div>';
  }
  el.innerHTML =
    '<div class="dash-grid">' +
      '<div class="dash-card"><div class="dash-val" style="color:var(--rest)">'+streak+'</div><div class="dash-lbl">&#128293; Streak</div></div>' +
      '<div class="dash-card"><div class="dash-val">'+total+'</div><div class="dash-lbl">Total</div></div>' +
      '<div class="dash-card"><div class="dash-val">'+avgDur+'m</div><div class="dash-lbl">Avg Time</div></div>' +
    '</div>' +
    '<div class="week-grid">'+weekHTML+'</div>' +
    (adh7!==null ? '<div class="supp-bar"><span class="supp-bar-lbl">&#128138; Supplement adherence (7-day)</span><span class="supp-bar-val">'+adh7+'%</span></div>' : '') +
    (adh30!==null ? '<div class="supp-bar"><span class="supp-bar-lbl">&#128138; Supplement adherence (30-day)</span><span class="supp-bar-val">'+adh30+'%</span></div>' : '') +
    '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px">Practice Sessions</div>';
}

function toggleSession(id) { document.getElementById('sc-'+id).classList.toggle('open'); }
function deleteSession(id) {
  confirm2('Delete session?','This practice record will be permanently removed.',function(){sessions=sessions.filter(function(s){return s.id!==id;});persist();renderHistory();});
}
function repeatSession(id) {
  var sess = sessions.find(function(s){ return s.id===id; });
  if (!sess) return;
  var prog = programs.find(function(p){ return p.id===sess.programId; });
  if (prog) {
    programs.forEach(function(p){ p.isActive=false; }); prog.isActive=true;
    persist(); goTo('practice'); toast('Switched to "'+prog.name+'"');
  } else {
    confirm2('Recreate Program?','"'+sess.programName+'" was deleted. Recreate it from this session?', function(){
      var np={id:uid(),name:sess.programName+' (restored)',exercises:sess.exercises.map(function(ex){return{id:uid(),name:ex.name,type:ex.type,sets:ex.targetSets,reps:ex.targetReps||0,work:ex.targetWork||0,rest:ex.targetRest||0,area:ex.area||''};}),isActive:true,createdAt:new Date().toISOString()};
      programs.forEach(function(p){p.isActive=false;}); programs.push(np);
      persist(); goTo('practice'); toast('Program restored!');
    });
  }
}

  doc.setFont('helvetica','bold'); doc.setFontSize(32); doc.setTextColor(56,189,248);

  doc.setFontSize(13); doc.setTextColor(226,232,240);
  doc.text('Personal Rehabilitation Report',W/2,104,{align:'center'});
  doc.setFontSize(10); doc.setTextColor(122,139,163);
  doc.text(dateStr,W/2,120,{align:'center'});
  doc.text('For healthcare provider review  |  Confidential',W/2,132,{align:'center'});
  var AC=[56,189,248],DARK=[12,16,24],GREY=[243,244,246],MUT=[107,114,128];
  function sec(title,sub){doc.addPage();doc.setFillColor(249,250,251);doc.rect(0,0,W,22,'F');doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(DARK[0],DARK[1],DARK[2]);doc.text(title,14,14);if(sub){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(MUT[0],MUT[1],MUT[2]);doc.text(sub,W-14,14,{align:'right'});}return 28;}
  // Programs
  var y=sec('Exercise Programs',programs.length+' program(s)');
  programs.forEach(function(p){
    if(!p.exercises.length)return;
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(DARK[0],DARK[1],DARK[2]);
    doc.text(p.name+(p.isActive?' (Active)':''),14,y);y+=6;
    doc.autoTable({startY:y,head:[['Exercise','Area','Type','Sets','Reps / Duration']],body:p.exercises.map(function(ex){return[ex.name,ex.area||'—',ex.type,ex.sets,ex.type==='reps'?ex.reps+' reps':ex.work+'s work / '+ex.rest+'s rest'];}),headStyles:{fillColor:AC,textColor:DARK,fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:GREY},styles:{fontSize:9,cellPadding:3},margin:{left:14,right:14}});
    y=doc.lastAutoTable.finalY+10;
  });
  // Supplements
  y=sec('Supplement Protocol',supplements.length+' supplements');
  if(supplements.length){doc.autoTable({startY:y,head:[['Supplement','Dose','Frequency','Timing','Notes']],body:supplements.map(function(s){return[s.name,s.dose||'—',s.freq||'—',s.timing||'—',s.notes||'—'];}),headStyles:{fillColor:[167,139,250],textColor:DARK,fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:GREY},styles:{fontSize:9,cellPadding:3},margin:{left:14,right:14}});}
  // History
  y=sec('Practice History',sessions.length+' sessions');
  if(sessions.length){doc.autoTable({startY:y,head:[['Date','Program','Duration','Mood','Rating','Exercises']],body:sessions.slice(0,60).map(function(s){var d=new Date(s.date),ds=d.toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});var exDetail=s.exercises.map(function(ex){return ex.name+' ('+ex.setsCompleted+' sets, '+fmt(ex.timeSpent)+(ex.pain>0?', Pain:'+ex.pain:'')+(ex.notes?' - '+ex.notes:'')+')'}).join('; ');return[ds,s.programName||'—',fmt(s.duration),s.mood||'—',s.rating?stars(s.rating,5):'—',exDetail];}),headStyles:{fillColor:[74,222,128],textColor:DARK,fontStyle:'bold',fontSize:8},alternateRowStyles:{fillColor:GREY},styles:{fontSize:7,cellPadding:2,overflow:'linebreak'},columnStyles:{0:{cellWidth:30},1:{cellWidth:24},2:{cellWidth:18},3:{cellWidth:10},4:{cellWidth:16}},margin:{left:14,right:14}});}
  doc.save('RehabTrack-'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('PDF saved!');
}

function exportCSV() {
  var rows = [['Date','Time','Day','Program','Exercise','Area','Type','Target Sets','Sets Done','Reps/Work(s)','Total Time(s)','Rest Intervals(s)','Pain(0-5)','Session Mood(1-5)','Session Rating(1-5)','Exercise Notes','Session Notes'].join(',')];
  sessions.forEach(function(s){
    var d=new Date(s.date);
    var date=d.toLocaleDateString('en-AU');
    var time=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});
    var day=d.toLocaleDateString('en-AU',{weekday:'long'});
    s.exercises.forEach(function(ex){
      rows.push([
        date,time,day,'"'+(s.programName||'')+'"','"'+ex.name+'"',ex.area||'',ex.type,
        ex.targetSets,ex.setsCompleted,
        ex.type==='reps'?ex.targetReps:ex.targetWork,
        ex.timeSpent,
        '"'+(ex.restIntervals||[]).join('; ')+'"',
        ex.pain,s.mood||'',s.rating||'',
        '"'+(ex.notes||'').replace(/"/g,"''")+'"',
        '"'+(s.notes||'').replace(/"/g,"''")+'"'
      ].join(','));
    });
  });
  var csv = rows.join('\n');
  var blob = new Blob([csv],{type:'text/csv'});
  var fname = 'RehabTrack-'+new Date().toISOString().slice(0,10)+'.csv';
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('CSV downloaded!');
}

async function exportJSON() {
  var data={version:3,exported:new Date().toISOString(),programs:programs,sessions:sessions,supplements:supplements,suppLogs:suppLogs};
  var json=JSON.stringify(data,null,2);
  var fname='RehabTrack-Backup-'+new Date().toISOString().slice(0,10)+'.json';
  var file=new File([new Blob([json],{type:'application/json'})],fname,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'RehabTrack Backup'});toast('Backup shared!');return;}catch(e){if(e.name==='AbortError')return;}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('Backup downloaded!');
}

async function handleImport(ev) {
  var file=ev.target.files[0]; if(!file) return;
  try {
    var text=await file.text(), data=JSON.parse(text);
    if(!data.programs&&!data.sessions){alert('Not a valid RehabTrack backup.');return;}
    confirm2('Import Backup?','This replaces ALL current data. Cannot be undone.',async function(){
      programs=data.programs||[]; sessions=data.sessions||[]; supplements=data.supplements||[]; suppLogs=data.suppLogs||[];
      if(!programs.length) programs=[{id:uid(),name:'My Program',exercises:[],isActive:true,createdAt:new Date().toISOString()}];
      await persistAll(); goTo(VIEW); toast('Backup restored!');
    });
  } catch(e){alert('Could not read file.');}
  ev.target.value='';
}
